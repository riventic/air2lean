# The proof fixtures of tests/roadmap: one Lake package, one library per fixture directory
# (docs/build-cache.md#proof-fixtures). Each check.sh builds its library with
# `python3 -B scripts/fixtures.py build LIB` (through the shared artifact cache, scripts/cas.py run):
# Lake's trace (source content, the traces of all imports, toolchain, options) decides what is
# elaborated again, and it is the only reuse. The outputs go to tests/roadmap/.lake/build, outside
# the root .lake/build/lib/lean, where proof receipts reject untracked compiled modules.
#
# A library's directory is its `srcDir`: a module's name is its path below the fixture directory.
# Lake builds only one of two modules with the same name, silently, so scripts/fixtures.py
# refuses to build when two libraries (or a library and the root package) share a module name.
name = "fixtures"

[[require]]
name = "air2lean"
path = "../.."

[[lean_lib]]
name = "AllocArena"
srcDir = "alloc-arena"
globs = ["AllocArena.+", "ArenaObstruction", "ArenaSpec", "ArenaSpec.+", "ArenaSpecFixed", "ArenaSpecFixed.+",
         "ArenaSpecMacos", "ArenaSpecMacos.+",
         "HeaderMixCX", "HeaderTagCX"]

[[lean_lib]]
name = "AllocFba"
srcDir = "alloc-fba"
globs = ["AllocFba.+"]

[[lean_lib]]
name = "AllocTranslated"
srcDir = "alloc-translated"
globs = ["AllocTranslated.+", "KernelBytes", "ListsPage", "PageAlloc", "PageAllocMacos", "PageCreation",
         "PageObstruction", "PageScratch", "PageSpec", "PageSpecMacos", "PageThread", "PageTok"]

[[lean_lib]]
name = "ListsFba"
srcDir = "lists-fba"
globs = ["ListsFba.+"]

# The modules of tests/roadmap/interfaces that ListsFba imports (M04's sentinel program and its
# proofs); interfaces/check.sh still elaborates the fixture's other files itself.
[[lean_lib]]
name = "Interfaces"
srcDir = "interfaces"
globs = ["Interfaces.Sentinel", "Interfaces.SentinelSpec"]

# The general symbolic executor `fsym` on library-only examples (tests/roadmap/sep-auto/check.sh).
[[lean_lib]]
name = "SepAuto"
srcDir = "sep-auto"
globs = ["SepAuto.+"]

# The one-logic scenarios over the full-state logic (tests/roadmap/one-logic/check.sh).
[[lean_lib]]
name = "OneLogic"
srcDir = "one-logic"
globs = ["OneLogic.+"]

# The architecture-audit claim fixtures (docs/architecture-audit/claims.md). No module imports two
# of them: Shadow and ShadowWithin redefine claim heads on purpose and clash only in the audit
# environment.
[[lean_lib]]
name = "AuditClaims"
srcDir = "architecture-audit/claims"
globs = ["AuditClaims.+"]

# One retained translation and one model per Zig version (`NanBits.V0_17_1.Gen`, `.Model`); the
# models of the older versions are instances of the 0.17.1 one (scripts/fixtures.py instance).
[[lean_lib]]
name = "NanBits"
srcDir = "nan-bits"
globs = ["NanBits.+"]

# As NanBits: two retained translations and one model per Zig version, and the
# version-independent regression rows (EncExactness.Rows).
[[lean_lib]]
name = "EncExactness"
srcDir = "enc-exactness"
globs = ["EncExactness.+"]

# As NanBits: per Zig version the retained translations of four sources (not every source at
# every version) and their models, and the shared formatting (PackedCasts.Show).
[[lean_lib]]
name = "PackedCasts"
srcDir = "packed-casts"
globs = ["PackedCasts.+"]

# big-endian/check.sh and concurrency.sh: as NanBits, per Zig version and target
# (BigEndian.V0_17_1.X64.Gen, BigEndian.Conc.V0_17_1.X64.Gen), the shared lines (BigEndian.Lines)
# and the byte-order facts (BigEndian.Proofs).
[[lean_lib]]
name = "BigEndian"
srcDir = "big-endian"
globs = ["BigEndian.+"]

# As NanBits: one retained translation and one model per Zig version.
[[lean_lib]]
name = "TryLifetimes"
srcDir = "try-pointers/lifetimes"
globs = ["TryLifetimes.+"]

# The outcome-taxonomy fixtures (Outcomes.Contracts, Outcomes.Taxonomy).
[[lean_lib]]
name = "Outcomes"
srcDir = "outcome-taxonomy"
globs = ["Outcomes.+"]

# The strength logs that import a fixture library's module (the others import only ZigLean and
# Proofs and are elaborated by CI's strength-log step).
[[lean_lib]]
name = "StrengthLog"
srcDir = "strength-log"
globs = ["OutcomeTaxonomy", "ThreadFixtures", "Vcs"]

# The verification-condition fixture's extraction module (strength-log/Vcs.lean imports it;
# CI's golden part also compiles it into the Extract.olean its mutants are checked against).
[[lean_lib]]
name = "VcsExtract"
srcDir = "vcs"
globs = ["Extract"]

# The proofs of the tuple-capture fixture over its retained translation, and their non-vacuity
# witnesses (ThreadTuples.Nonvacuity: imported by strength-log/ThreadFixtures.lean).
# thread-tuples/check.sh also compiles them against each version's fresh translation.
[[lean_lib]]
name = "ThreadTuples"
srcDir = "thread-tuples"
globs = ["ThreadTuples.Gen", "ThreadTuples.Proofs", "ThreadTuples.Nonvacuity"]

# The failed-spawn fixture's retained translation, proofs and non-vacuity witnesses
# (SpawnFailure.Nonvacuity imports the kernel-run theorems of Runtime; strength-log/ThreadFixtures.lean
# imports it). spawn-failure/qualify.py compiles the proofs again on its checked translation.
[[lean_lib]]
name = "SpawnFailure"
srcDir = "spawn-failure"
globs = ["SpawnFailure.Gen", "SpawnFailure.Group", "SpawnFailure.Pair", "SpawnFailure.Nonvacuity", "Runtime"]

# The small dispatch machines of dispatch-templates/check.sh (DispatchTemplate.Template).
[[lean_lib]]
name = "DispatchTemplate"
srcDir = "dispatch-templates"
globs = ["DispatchTemplate.+"]

# The claim-strength regression fixtures (tests/roadmap/claims/check.sh, docs/claim-strength.md).
# Fixture declares spoofs of reserved claim-head names; no module imports it.
[[lean_lib]]
name = "Claims"
srcDir = "claims"
globs = ["Fixture", "AllocatorApplications", "AllocatorImported"]

# The ring-buffer queue of queue-adt/check.sh (P04, P06): the retained 0.17.1 translation
# (QueueAdt.Gen), the ring's proof of the queue contract and the clients proved from the contract.
[[lean_lib]]
name = "QueueAdt"
srcDir = "queue-adt"
globs = ["QueueAdt.+"]
