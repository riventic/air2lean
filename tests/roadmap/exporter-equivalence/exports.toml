id = "thread-tuples"
versions = ["0.16.0"]
dir = "tests/roadmap/thread-tuples/air/{version}"
source = "tests/roadmap/thread-tuples/thread_tuples.zig"
filter_file = "tests/roadmap/thread-tuples/filter"
compare = "exact"

