# Recorded compiler exports outside tests/golden (scripts/exporter-equivalence.py).
#
# Each [[export]] is one committed AIR directory and the patched-compiler command that made it:
#
#   ZIG_AIR_JSON_DIR=<fresh> ZIG_AIR_JSON_FILTER=<filter> <zig> build-obj -fno-emit-bin <args> <source>
#
#   id       unique name; `{version}` is substituted in `dir`
#   versions the Zig versions with a committed directory
#   dir      the committed directory (repository-relative)
#   source   the root source file
#   filter   ZIG_AIR_JSON_FILTER (empty or absent: every function); `filter_file` adds one
#            prefix per line; `filter_from_committed = true` adds the full name of every
#            committed function (a kept call closure that an unfiltered export cannot repeat)
#   args     the compiler arguments between `build-obj -fno-emit-bin` and the source
#            (default: the `default_args` below)
#   compare  "exact": the fresh directory equals the committed one, file for file and byte for
#            byte. "subset": every committed file is in the fresh directory with the same bytes
#            (the fixture keeps a selection, e.g. a call closure, of what the filter exports).
#            When the bytes differ, the report adds the comparison after the golden
#            normalization (scripts/normalize-air.py): a difference only there is compiler
#            numbering (`__anon_<n>`), anything else is a fixture older than the exporter.
#
# Every key of scripts/coverage.py COMPILER_FIXTURE_ROOTS is either an [[export]] here or an
# [[excluded]] entry with its reason (test_exporter_equivalence.py checks it). The goldens
# (tests/golden) need no entry: scripts/exporter-equivalence.py derives their commands from
# examples/ exactly as scripts/check.sh does.

default_args = ["-OReleaseSafe", "-fno-error-tracing", "-target", "x86_64-linux", "-mcpu=baseline"]

