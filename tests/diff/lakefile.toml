# Separate Lake package: the parent lakefile.toml (../..) is off-limits to this tool, so the
# differential-test executable lives in its own package that requires the parent by path.
name = "difftest"
defaultTargets = ["difftest"]

[[require]]
name = "air2lean"
path = "../.."

[[lean_exe]]
name = "difftest"
root = "Diff"
# Static libm (tests/diff/libm/libm.zig), built by scripts/diff.sh before `lake build difftest`.
# Lake does not track this path as a build input, so a rebuild does not by itself relink
# `difftest` against a changed archive — scripts/diff.sh forces that by deleting the stale binary.
moreLinkArgs = ["./out/libm/air2lean_libm.a"]
