# Separate Lake package: the parent lakefile.toml (../..) is off-limits to this tool, so the
# differential-test executable lives in its own package that requires the parent by path.
name = "difftest"
defaultTargets = ["difftest"]

[[require]]
name = "air2lean"
path = "../.."

# Register the imported observation module so Lake supplies its build facet.
[[lean_lib]]
name = "Outcome"

[[lean_lib]]
name = "ScheduleSearch"

# Static libm (tests/diff/libm/libm.zig) and asm (tests/diff/asm/asm.zig) archives, built by
# scripts/diff.sh before `lake build difftest`. They are input files linked through
# `moreLinkObjs`, so their content is part of each executable's trace and of its key in Lake's
# artifact cache (scripts/cas.py run). Never link them through `moreLinkArgs`: a path there is not
# a build input, and a cached executable linked against another Zig's archive is restored for the
# same Lean sources (docs/architecture-audit/float-selection.md).
[[input_file]]
name = "libm"
path = "out/libm/air2lean_libm.a"

[[input_file]]
name = "asm"
path = "out/asm/air2lean_asm.a"

[[lean_exe]]
name = "difftest"
root = "Diff"
moreLinkObjs = ["libm", "asm"]

[[lean_lib]]
name = "Concurrent"

[[lean_exe]]
name = "schedules"
root = "Schedules"
# Concurrent Gen modules import ZigLean, including its libm extern declarations.
moreLinkObjs = ["libm"]
