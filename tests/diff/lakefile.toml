# Separate Lake package: the parent lakefile.toml (../..) is off-limits to this tool, so the
# differential-test executable lives in its own package that requires the parent by path.
name = "difftest"
defaultTargets = ["difftest"]

[[require]]
name = "air2lean"
path = "../.."

# Register the imported observation module so Lake supplies its build facet.
[[lean_lib]]
name = "Outcome"

[[lean_exe]]
name = "difftest"
root = "Diff"
# Static libm (tests/diff/libm/libm.zig) and asm (tests/diff/asm/asm.zig) archives, built by
# scripts/diff.sh before `lake build difftest`. Lake does not track these paths as build inputs,
# so a rebuild does not by itself relink `difftest` against a changed archive — scripts/diff.sh
# forces that by deleting the stale binary.
moreLinkArgs = ["./out/libm/air2lean_libm.a", "./out/asm/air2lean_asm.a"]
