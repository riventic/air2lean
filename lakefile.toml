[[lean_lib]]
name = "Air2Lean"

[[lean_lib]]
name = "Proofs"
globs = ["Proofs.+"]

[[lean_lib]]
name = "AssuranceTools"
roots = ["tools.Assurance", "tools.AllocatorAdmission", "tools.OutcomeContracts"]

[[lean_exe]]
name = "air2lean"
root = "Air2Lean.Main"
