name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run of the older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AIR2LEAN_EXAMPLES: ${{ matrix.examples }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full jobs: every example, the float probe, the diff test and the proofs.
          - zig: "0.16.0"
            examples: ""
            full: true
            mutate: false
          - zig: "0.15.2"
            examples: ""
            full: true
            mutate: false
          # 0.17.0 is in qualification (docs/zig-0.17-ci.md): a full job, but gates whose
          # source/native qualification is version-specific stay on their qualified versions.
          # The default and the mutation shards stay on 0.16.0 until 0.17.0 is qualified.
          - zig: "0.17.0"
            examples: ""
            full: true
            mutate: false
          # 0.14.1: `floatconv` is excluded (0.14.1 lowers `@intFromFloat` without the check,
          # zig-patch/0.14.1/TAGS.md), `slices` (no `@memmove`) and `lists` (its
          # `ArrayListUnmanaged` is another type, docs/std-models.md). Its std cannot build the
          # diff harness; the stale-Gen.lean check shows the translation is the one that the
          # full jobs test, and the proof step builds the proofs against it.
          - zig: "0.14.1"
            examples: "basic recursion options floatops floats errors variants pointers layout"
            full: false
            mutate: false
          # The mutation test, on the default version, in 5 jobs (one per line of
          # scripts/mutation-shards.txt): they run in parallel with the full jobs.
          # scripts/mutate.sh builds all it needs.
          - zig: "0.16.0"
            examples: ""
            full: false
            mutate: true
            shard: 1
          - zig: "0.16.0"
            examples: ""
            full: false
            mutate: true
            shard: 2
          - zig: "0.16.0"
            examples: ""
            full: false
            mutate: true
            shard: 3
          - zig: "0.16.0"
            examples: ""
            full: false
            mutate: true
            shard: 4
          - zig: "0.16.0"
            examples: ""
            full: false
            mutate: true
            shard: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Offline compiler inventory regressions
        run: python3 tests/roadmap/inventory/test_inventory.py

      - name: Schedule exploration cap accounting regressions
        run: python3 -I -B tests/roadmap/schedule-caps/test_exploration.py

      - name: Counterexample bundle regressions
        run: python3 -I -B tests/roadmap/counterexamples/test_counterexample.py

      - name: Local Lake cache hygiene regressions
        run: python3 tests/roadmap/local-ci/test_cache.py

      # Fixture receipts/audits/diff summaries only; no Lean, Lake or Zig.
      - name: Verification coverage report regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/roadmap/coverage-report -p 'test_*.py' -v

      # Synthetic diff summaries only; capped/timer/unsupported outcomes refuse absence claims.
      - name: Outcome taxonomy regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/roadmap/outcome-taxonomy/test_taxonomy.py

      # Stub translator, Lake and audit; real build-guard and claims. No Lean, Lake or Zig.
      - name: Project check and reproducibility record regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/roadmap/project-check -p 'test_*.py' -v

      # Offline: committed sources only. Fails when docs/support-matrix.md, README or PLAN
      # regions are stale or README, PLAN, ROADMAP, CI and the CLI help disagree.
      - name: Support matrix is current and consistent
        if: ${{ matrix.full && !matrix.mutate && matrix.zig == '0.16.0' }}
        run: |
          python3 scripts/support-matrix.py check
          python3 -m unittest discover -s tests/roadmap/support-matrix -v

      # Offline (Q05): each version x host x target x profile path that compatibility.json
      # declares maps to native execution, target probe and proof steps of a CI job on that
      # host; foreign-golden compilation does not count (docs/target-matrix.md).
      - name: Declared target matrix is natively backed
        if: ${{ matrix.full && !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/roadmap/target-matrix -v
          python3 scripts/target-matrix.py check

      # Offline fixture repositories; runs before check.sh rewrites committed Gen.lean files.
      - name: Artifact manifest provenance regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/artifact-manifest/test_manifest.py

      # Rebinding, mutant shapes and proof separation of the A03 asm-wrapper harness (no Lean).
      - name: Asm wrapper harness offline regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tests/roadmap/asm-wrappers -v
          python3 tests/roadmap/asm-wrappers/audit.py

      - name: Semantic fingerprint classification regressions
        run: python3 -I -B tests/roadmap/stable-generation/test_fingerprints.py

      # Before check.sh replaces the committed Proofs/<Ex>/Gen.lean files the index describes.
      - name: Theorem premise reference and index
        run: |
          python3 -B tests/roadmap/premises/test_premises.py
          python3 -B scripts/premises.py check

      # Offline: tutorial layout, README sections and premise lists match the index.
      - name: Tutorial layout regressions
        run: python3 -B -m unittest discover -s tests/roadmap/tutorials -v

      # Offline, before check.sh replaces the committed Gen.lean files whose hashes it compares:
      # every listed theorem has a current recorded check per translation, and no document
      # labels a single-step or single-schedule theorem as holding under every schedule.
      - name: Theorem inventory scope and check results
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/theorem-inventory/test_inventory.py
          python3 -B scripts/theorem-inventory.py check

      # Every numerical theorem states IEEE, compiler-rt@<versions> or abstract-spec semantics.
      - name: Float-semantics label regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/roadmap/float-semantics -v
          python3 scripts/float-semantics.py check

      # Q07: synthetic inventories and stub runners; consumes coverage.py diff, runs no compiler.
      - name: Upgrade qualification driver regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/roadmap/upgrade-qualification/test_qualify.py

      # Q02: every register ID maps to negative tests and designated mutants; complete rows
      # need both. The Python-side mutants run in memory against existing regressions.
      - name: Mutation map and Python-side mutants
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/mutation-map/test_mutation_map.py -v
          python3 -B scripts/mutation-map.py check
          python3 -B tests/roadmap/mutation-map/mutants.py

      # Each optimize mode x backend pair has a qualification record (docs/build-modes.md).
      - name: Build-mode qualification records
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/roadmap/build-modes -v
          python3 -B scripts/build-modes.py check

      # Inspect checksum-pinned pristine sources even when a patched compiler is cached.
      # Run before check.sh replaces committed generated proof modules.
      - name: Check compiler-derived coverage inventory
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          source_temp=$(mktemp -d "$RUNNER_TEMP/air-inventory.XXXXXX")
          trap 'rm -rf "$source_temp"' EXIT
          url=$(zig-patch/toml-get.sh '["${{ matrix.zig }}"]' url)
          sha256=$(zig-patch/toml-get.sh '["${{ matrix.zig }}"]' sha256)
          curl -fL --output "$source_temp/source.tar.xz" "$url"
          echo "$sha256  $source_temp/source.tar.xz" | sha256sum -c -
          mkdir "$source_temp/source"
          tar -xJf "$source_temp/source.tar.xz" -C "$source_temp/source" --strip-components=1
          python3 scripts/coverage.py check --version '${{ matrix.zig }}' \
            --source "$source_temp/source" --os linux --inventory 'coverage/${{ matrix.zig }}.json'

      - name: Shell check regressions
        run: scripts/review-checks.sh

      - name: Build guard offline regressions
        run: |
          set -euo pipefail
          python3 tests/roadmap/build-budgets/test_guard.py 2>&1 | tee "$RUNNER_TEMP/build-guard-tests.log"

      # I08: stub-only interrupt/timeout/partial-write regressions for translate.sh, check.sh
      # and proof receipts (docs/safe-output.md); no compiler or Lean run.
      - name: Safe output and cancellation regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/roadmap/safe-output -p 'test_*.py' -v 2>&1 \
            | tee "$RUNNER_TEMP/safe-output-tests.log"

      # Q01 (docs/fuzzing.md): generator determinism, shrinker minimality against synthetic
      # oracles and typed Zig generator invariants; no translator, compiler or Lean run.
      - name: Fuzz generator and shrinker regressions
        run: tests/roadmap/fuzz/check.sh --light

      - name: Performance budget gate regressions
        run: |
          set -euo pipefail
          python3 tests/roadmap/perf-budgets/test_perf_budgets.py
          python3 scripts/perf-budgets.py validate

      - name: First-use workflow regressions
        run: python3 tests/usability/workflow.py

      - name: Release compatibility metadata and doctor regressions
        run: |
          set -euo pipefail
          python3 scripts/compat.py check
          python3 -m unittest discover -s tests/roadmap/distribution -v

      # Offline fixture repositories (docs/release-record.md). The ledger check verifies each
      # entry's reviewed revision and baseline hash; the shallow checkout fetches only those
      # commits. Local CI snapshots have no origin or history: structure only there.
      - name: Release record and review ledger regressions
        if: ${{ matrix.full && !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/roadmap/release-record -v
          if git remote get-url origin >/dev/null 2>&1; then
            read -r -a reviewed <<<"$(python3 scripts/release-record.py ledger --revisions)"
            git fetch --no-tags --depth=1 origin "${reviewed[@]}"
            python3 scripts/release-record.py ledger
          else
            python3 scripts/release-record.py ledger --allow-unfetched
          fi

      # Bootstrap zig for zig-patch/build.sh: it needs a host `zig` of the exact target
      # version on PATH (the Zig compiler source builds with its own release). Pinned in
      # zig-patch/versions.toml's [ci.host-zig."<version>"] table.
      - name: Install host zig
        run: |
          set -euo pipefail
          url=$(zig-patch/toml-get.sh '[ci.host-zig."${{ matrix.zig }}"]' url)
          sha256=$(zig-patch/toml-get.sh '[ci.host-zig."${{ matrix.zig }}"]' sha256)
          curl -fL --output host-zig.tar.xz "$url"
          echo "$sha256  host-zig.tar.xz" | sha256sum -c -
          mkdir -p host-zig
          tar -xJf host-zig.tar.xz -C host-zig --strip-components=1
          echo "$PWD/host-zig" >> "$GITHUB_PATH"

      # The float model follows the reference target (x86_64-linux); this checks that the
      # target still gives the results it depends on (docs/floats.md).
      - name: Float target probe
        if: matrix.full
        run: scripts/floatprobe.sh

      # Cache the patched compiler: zig-patch/build.sh takes a few minutes. Rebuild only when
      # the exporter, the version's hook, the version pin, or the build script itself changes.
      - name: Cache patched zig
        id: cache-zig-air
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-air-${{ matrix.zig }}/
          key: zig-air-${{ matrix.zig }}-${{ hashFiles('zig-patch/air-json/*.zig', format('zig-patch/{0}/hook.patch', matrix.zig), 'zig-patch/versions.toml', 'zig-patch/build.sh', 'zig-patch/lock.sh') }}

      # One retry: the compile step can go over the memory bound that build.zig declares
      # ("memory usage peaked at …"); the peak varies from run to run.
      - name: Build patched zig
        if: steps.cache-zig-air.outputs.cache-hit != 'true'
        run: zig-patch/build.sh ${{ matrix.zig }} || zig-patch/build.sh ${{ matrix.zig }}

      # elan installs `lake`/`lean` shims that read a package's lean-toolchain file (here:
      # leanprover/lean4:v4.34.0) and fetch that exact toolchain on first use. Installer
      # pinned in zig-patch/versions.toml's [ci.elan] table.
      - name: Install elan
        run: |
          set -euo pipefail
          url=$(zig-patch/toml-get.sh '[ci.elan]' url)
          sha256=$(zig-patch/toml-get.sh '[ci.elan]' sha256)
          curl -fL --output elan.tar.gz "$url"
          echo "$sha256  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz
          chmod +x elan-init
          ./elan-init --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build (root package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-root-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Cache Lake build (tests/diff package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/diff/.lake
          key: lake-diff-${{ hashFiles('tests/diff/lean-toolchain', 'tests/diff/lake-manifest.json') }}

      - name: Prune absent-source Lake modules
        run: python3 scripts/local-ci-steps.py --prune-cache

      - name: Build runtime library + translator
        run: lake build

      # --timing-json observes translator phases only: emitted Lean must stay byte-identical.
      - name: Translator timing flag preservation
        if: ${{ !matrix.mutate }}
        run: python3 -I -B tests/roadmap/perf-budgets/timing_cli.py --air2lean "$PWD/.lake/build/bin/air2lean"

      # Before check.sh rewrites Proofs/<Ex>/Gen.lean: the sidecar flag must leave them byte-identical.
      - name: Source maps and semantic fingerprints on golden AIR
        if: ${{ !matrix.mutate }}
        run: python3 -I -B tests/roadmap/stable-generation/test_cli.py "$PWD/.lake/build/bin/air2lean"

      - name: Stable scalar proof API regressions
        if: ${{ matrix.full && !matrix.mutate && matrix.zig == '0.15.2' || matrix.full && !matrix.mutate && matrix.zig == '0.16.0' }}
        run: |
          set -euo pipefail
          proof_api_dir="$RUNNER_TEMP/proof-api"
          mkdir -p "$proof_api_dir/tmp"
          export TMPDIR="$proof_api_dir/tmp"
          python3 -I -B tests/roadmap/proof-api/test_report.py 2>&1 | tee "$proof_api_dir/report.log"
          python3 -I -B tests/roadmap/proof-api/test_cli.py "$PWD/.lake/build/bin/air2lean" \
            --retain "$proof_api_dir/Generated.lean" 2>&1 | tee "$proof_api_dir/cli.log"
          for client in Generated.client Generated.renumbered.client Generated.unrelated.client; do
            lake env lean "$proof_api_dir/$client.lean" 2>&1 | tee "$proof_api_dir/$client.log"
          done
          mutation_status=0
          lake env lean "$proof_api_dir/Generated.changed.client.lean" \
            > "$proof_api_dir/mutation.log" 2>&1 || mutation_status=$?
          cat "$proof_api_dir/mutation.log"
          test "$mutation_status" -eq 1
          grep -Fq 'not definitionally equal' "$proof_api_dir/mutation.log"

      - name: Public exporter filename qualification
        if: ${{ !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
        run: bash scripts/check-export-names.sh

      - name: Build optional separation proof tools
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof-tools"
          lake build ZigLean.Sep.Automation ZigLean.Sep.Total ZigLean.Sep.Array ZigLean.Sep.Array.Reassemble Proofs.Slices.Gen 2>&1 | tee "$RUNNER_TEMP/proof-tools/build.log"

      - name: Separation normalization regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Normalize.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Normalize.log"

      - name: Separation client regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Clients.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Clients.log"

      - name: Explicit array framing regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Array.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Array.log"

      - name: Memory-backed array reassembly and generated clients
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Reassemble.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Reassemble.log"
          lake env lean tests/roadmap/proof-tools/ArrayClients.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/ArrayClients.log"

      - name: Total correctness regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Total.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Total.log"

      - name: Loop template and range-conversion regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loop-tactics"
          lake build ZigLean.Sep.LoopTemplate ZigLean.Range Proofs.Lists.Sep 2>&1 | tee "$RUNNER_TEMP/loop-tactics/build.log"
          lake env lean tests/roadmap/loop-tactics/Template.lean 2>&1 | tee "$RUNNER_TEMP/loop-tactics/Template.log"
          lake env lean tests/roadmap/loop-tactics/Queue.lean 2>&1 | tee "$RUNNER_TEMP/loop-tactics/Queue.log"

      - name: Validate AIR input and whole-program signatures
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/input-validation"
          mkdir -p "$evidence_dir/tmp"
          export TMPDIR="$evidence_dir/tmp"
          lake env lean tests/roadmap/input-validation/Validation.lean 2>&1 | tee "$evidence_dir/api.log"
          python3 tests/roadmap/input-validation/test_cli.py "$PWD/.lake/build/bin/air2lean" 2>&1 | tee "$evidence_dir/cli.log"

      # Q01: committed shrunk reproducers, then a small seeded malformed-AIR budget; any
      # failure is shrunk into $RUNNER_TEMP/air-fuzz/failures (docs/fuzzing.md).
      - name: Malformed AIR JSON fuzzing
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          fuzz_dir="$RUNNER_TEMP/air-fuzz"
          mkdir -p "$fuzz_dir/tmp"
          export TMPDIR="$fuzz_dir/tmp"
          tests/roadmap/fuzz/check.sh --air "$PWD/.lake/build/bin/air2lean" 300 "$fuzz_dir/failures" 2>&1 \
            | tee "$fuzz_dir/fuzz.log"

      - name: Validate check-only diagnostic collection
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          diagnostics_evidence_dir="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics_evidence_dir/tmp"
          export TMPDIR="$diagnostics_evidence_dir/tmp"
          lake env lean tests/roadmap/diagnostics/Collector.lean 2>&1 | tee "$diagnostics_evidence_dir/collector.log"
          lake env lean --run tests/roadmap/diagnostics/RuntimeTags.lean 2>&1 | tee "$diagnostics_evidence_dir/runtime-tags.log"
          python3 tests/roadmap/diagnostics/test_cli.py --self-test 2>&1 | tee "$diagnostics_evidence_dir/harness.log"
          python3 tests/roadmap/diagnostics/test_cli.py "$PWD/.lake/build/bin/air2lean" 2>&1 | tee "$diagnostics_evidence_dir/cli.log"
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/blocker-collection/test_cli.py "$PWD/.lake/build/bin/air2lean" 2>&1 | tee "$diagnostics_evidence_dir/blockers.log"
      - name: First-use CLI diagnostics
        run: python3 tests/usability/cli.py

      # Synthetic 0.17.0 AIR (no compiler output): tag table, @divCeil, new/renamed tag
      # translation and rejections, and the 0.16.0 goldens rewritten to 0.17.0 spelling.
      - name: Zig 0.17.0 translator regressions
        if: ${{ !matrix.mutate && matrix.zig == '0.17.0' }}
        run: |
          set -euo pipefail
          lake env lean --run tests/roadmap/zig017/Tags.lean
          python3 -B tests/roadmap/zig017/test_cli.py "$PWD/.lake/build/bin/air2lean" --elaborate

      # Registry fixtures are version neutral; check their typed imported evidence and client
      # once, with generated files/logs isolated from the checkout. No additional upload.
      - name: External model contracts
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_MODEL_EVIDENCE: ${{ runner.temp }}/model-contracts
        run: |
          python3 tests/roadmap/models/test_gate.py
          python3 -B tests/roadmap/models/test_external_contracts.py
          scripts/model-contracts.sh

      # This checks committed Flow artifacts only: no production checkout, Zig export,
      # native reproduction, or claim about compiler preservation is part of this CI gate.
      - name: Flow timestamp artifact-only proofs and provenance guards
        if: matrix.full && matrix.zig == '0.16.0'
        env:
          TMPDIR: ${{ runner.temp }}
          FLOW_TIME_SOURCE: ${{ runner.temp }}/absent-flow-checkout/time.zig
        run: |
          set -euo pipefail
          python3 tests/roadmap/flow-time/test_provenance.py
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ripgrep
          fi
          bash scripts/flow-time.sh --check-artifacts

      # The portable gate checks all supported synthetic signatures without invoking Zig.
      # Full 0.16 qualification also exports baseline Linux AIR and executes finite native calls.
      # Detailed evidence stays in RUNNER_TEMP, outside the cached .lake tree; no upload step.
      - name: Progress hint qualification
        if: ${{ !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_PROGRESS_ARTIFACT_DIR: ${{ runner.temp }}/progress-qualification
        run: |
          if [ '${{ matrix.zig }}' = '0.16.0' ]; then
            scripts/progress-hints.sh full
          else
            scripts/progress-hints.sh
          fi

      - name: Finite progress kernel contracts
        if: ${{ matrix.full && !matrix.mutate }}
        run: lake env lean tests/roadmap/progress/Total.lean

      # Translation and input/output hash checks; declared proof goals remain unverified.
      - name: Project manifest regressions and example translation
        if: matrix.full && matrix.zig == '0.16.0'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/roadmap/project -v
          # Consumer mocks need no diagnostic producer; actual integration requires PR 78.
          python3 -m unittest discover -s tests/roadmap/project-diagnostics -v
          work="$(mktemp -d "${RUNNER_TEMP}/air2lean-project.XXXXXX")"
          python3 scripts/project.py translate example-project.json \
            --translator .lake/build/bin/air2lean --out "$work/artifact" \
            > "$work/translation.json"
          python3 scripts/project.py verify example-project.json \
            --artifact "$work/artifact" > "$work/verification.json"
          cat "$work/verification.json"
          python3 scripts/project-diagnostics.py check example-project.json \
            --translator .lake/build/bin/air2lean --out "$work/diagnostics.json" \
            > "$work/diagnostics-stdout.json"
          cmp "$work/diagnostics.json" "$work/diagnostics-stdout.json"
          python3 - "$work/diagnostics.json" <<'PY_CHECK'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              report = json.load(stream)
          assert report['schema'] == 1 and report['kind'] == 'air2lean-project-diagnostics'
          assert report['status'] == 'checked' and report['complete'] and not report['truncated']
          assert report['proof_status'] == 'not_run' and report['runtime_outcomes'] == 'not_observed'
          assert report['source_correspondence'] == 'not_attested'
          assert report['producer_protocol']['qualification'] == 'not_attested_by_adapter'
          assert report['root_checks'] and all(
              root['status'] == 'checked' and root['producer']['status'] == 'checked'
              for root in report['root_checks'])
          PY_CHECK

      - name: Nullable mutation classifier regressions
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        run: python3 -B tests/roadmap/null-pointers/test_classify_mutant.py

      # The scalar C/allowzero fragment is qualified on 0.16.0. Use this job's
      # patched exporter and separately installed matching shipping compiler.
      - name: Scalar nullable pointer source and semantic gate
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_NULL_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_NULL_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_NULL_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_NULL_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
        run: tests/roadmap/null-pointers/check.sh

      - name: Byte sentinel allocation source, ownership and kernel mutations
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_SENTINEL_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_SENTINEL_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_SENTINEL_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
        run: |
          python3 -B tests/roadmap/byte-sentinel/static.py
          bash tests/roadmap/byte-sentinel/check.sh

      # Selected policy correspondence on the native 64-bit reference CI host. Keep
      # reports in RUNNER_TEMP, outside cached .lake directories; no artifact upload.
      - name: Allocation policy proofs, correspondence and semantic mutations
        if: matrix.full
        env:
          AIR2LEAN_ALLOCATION_REPORT_DIR: ${{ runner.temp }}/allocation-policy-${{ matrix.zig }}
        run: |
          set -euo pipefail
          mkdir -p "$AIR2LEAN_ALLOCATION_REPORT_DIR"
          cp docs/allocation-policy-report.json "$AIR2LEAN_ALLOCATION_REPORT_DIR/source-qualification-status.json"
          python3 tests/roadmap/allocation-policy/static.py 2>&1 | tee "$AIR2LEAN_ALLOCATION_REPORT_DIR/static.log"
          bash tests/roadmap/allocation-policy/check.sh 2>&1 | tee "$AIR2LEAN_ALLOCATION_REPORT_DIR/check.log"
          python3 tests/roadmap/allocation-policy/mutations.py 2>&1 | tee "$AIR2LEAN_ALLOCATION_REPORT_DIR/mutations.log"

      # C01's checked source/export/proof fragment is qualified on 0.16.0.
      # Fresh exports use the pinned patched compiler; native tests use stock Zig.
      - name: Thread tuple source and ownership gate
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
          AIR2LEAN_TUPLE_ZIG_VERSION: ${{ matrix.zig }}
        run: |
          set -euo pipefail
          lake build ZigLean.Conc.Csl ZigLean.Sep
          python3 tests/roadmap/thread-tuples/guard-tests.py
          python3 tests/roadmap/thread-tuples/mutation-tests.py
          [ "$("$AIR2LEAN_ZIG_AIR" version)" = "$AIR2LEAN_TUPLE_ZIG_VERSION" ]
          [ "$("$AIR2LEAN_ZIG_NATIVE" version)" = "$AIR2LEAN_TUPLE_ZIG_VERSION" ]
          work=$(mktemp -d "$RUNNER_TEMP/thread-tuples.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          bash tests/roadmap/thread-tuples/check.sh --export "$work/air"
          "$AIR2LEAN_TRANSLATOR" "$work/air" -o "$work/Gen.lean" --namespace ThreadTuples --prefix thread_tuples.
          python3 scripts/normalize-generated.py report "$work/Gen.lean" "$work/air" "$work/generated-report.json"
          python3 scripts/normalize-generated.py compare tests/roadmap/thread-tuples/ThreadTuples/Gen.lean "$work/Gen.lean" "$work/generated-report.json"
          lake env lean -R "$work" "$work/Gen.lean"
          bash tests/roadmap/thread-tuples/check.sh --native
          bash tests/roadmap/thread-tuples/check.sh --check-artifacts
          bash tests/roadmap/thread-tuples/check.sh --adapter-contract "$work/adapter-contract"

      - name: Fallible thread assignment and group fallback gate
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
          AIR2LEAN_SPAWN_VERSION: ${{ matrix.zig }}
          AIR2LEAN_SPAWN_ARTIFACT_DIR: ${{ runner.temp }}/spawn-failure
        run: |
          set -euo pipefail
          python3 tests/roadmap/spawn-failure/harness-tests.py
          bash tests/roadmap/spawn-failure/check.sh --full

      - name: Finite symbolic error-storage model and checker controls
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          storage_evidence_dir="$RUNNER_TEMP/error-storage-controls"
          mkdir -p "$storage_evidence_dir"
          lake build ZigLean.Mem.Lemmas ZigLean.Sep.Try ZigLean.Sep.Discard
          lake env lean --run tests/roadmap/error-storage/Qualifier.lean
          lake env lean --run tests/roadmap/error-storage/GlobalAlias.lean
          lake env lean --run tests/roadmap/error-storage/Runtime.lean
          lake env lean --run tests/roadmap/error-storage/Pipeline.lean "$storage_evidence_dir/Synthetic.lean"
          lake env lean -R "$storage_evidence_dir" "$storage_evidence_dir/Synthetic.lean"

      # Source/native correspondence is bounded to explicit stage2_x86_64 Linux16.
      - name: Global payload source, generated clients and semantic mutations
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_ZIG_BACKEND: stage2_x86_64
        run: |
          set -euo pipefail
          lake build ZigLean Air2Lean air2lean
          lake env lean tests/roadmap/global-payload-pointers/ExceptEq.lean
          python3 -m unittest discover -s tests/roadmap/global-payload-pointers -v
          export AIR2LEAN_LEAN=$(lake env which lean)
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          bash tests/roadmap/global-payload-pointers/check.sh --kernel
          bash tests/roadmap/global-payload-pointers/check.sh --native
          fresh=$(mktemp -d "$RUNNER_TEMP/air2lean-global-payload-source.XXXXXX")
          trap 'rm -rf "$fresh"' EXIT
          bash tests/roadmap/global-payload-pointers/check.sh --export "$fresh/air"
          bash tests/roadmap/global-payload-pointers/check.sh --export-reject "$fresh/reject-air"
          .lake/build/bin/air2lean "$fresh/air" -o "$fresh/Gen.lean" --namespace GlobalPayload --prefix global_payloads.
          python3 scripts/normalize-generated.py report "$fresh/Gen.lean" "$fresh/air" "$fresh/generated-report.json"
          AIR2LEAN_GLOBAL_ACTUAL_GEN="$fresh/Gen.lean" AIR2LEAN_GLOBAL_CLIENT_OUT="$fresh/clients" \
            bash tests/roadmap/global-payload-pointers/check-generated.sh

      # L04 actual compiler/native qualification is currently specific to 0.16.0.
      # 0.14/0.15 exporter APIs were source-inspected; their synthetic fixtures are
      # checked in this gate, without claiming native/export qualification for them.
      - name: Pointer try ownership, native and fresh source regressions
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          lake build ZigLean.Sep.Try ZigLean.Sep.Discard
          python3 -m unittest discover -s tests/roadmap/try-pointers -v
          bash tests/roadmap/try-pointers/check.sh --check-artifacts
          bash tests/roadmap/try-pointers/check.sh --native
          fresh=$(mktemp -d "$RUNNER_TEMP/air2lean-pointer-try-source.XXXXXX")
          trap 'rm -rf "$fresh"' EXIT
          bash tests/roadmap/try-pointers/check.sh --export "$fresh/air"
          python3 tests/roadmap/try-pointers/check-artifacts.py --fresh-air "$fresh/air"
          "$AIR2LEAN_TRANSLATOR" "$fresh/air" -o "$fresh/Gen.lean" \
            --namespace TryPointers --prefix try_pointers.
          python3 scripts/normalize-generated.py report "$fresh/Gen.lean" "$fresh/air" "$fresh/generated-report.json"
          python3 scripts/normalize-generated.py compare tests/roadmap/try-pointers/TryPointers/Gen.lean "$fresh/Gen.lean" "$fresh/generated-report.json"

      - name: Golden AIR, translate, build, differential test
        if: ${{ !matrix.mutate }}
        env:
          AIR2LEAN_CI: "1"
          AIR2LEAN_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_DIFF: ${{ matrix.full && '1' || '0' }}
          AIR2LEAN_OUT_DIR: ${{ runner.temp }}/air-out
        run: scripts/check.sh

      # A failed check hands out the AIR that this host dumped: the golden files of this OS
      # (tests/golden/<version>/<ex>/air-linux/) come from here (docs/generated-code.md).
      - name: Upload the dumped AIR
        if: failure() && !matrix.mutate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: air-${{ matrix.zig }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/air-out
          if-no-files-found: ignore
          retention-days: 7

      - name: Typed outcomes and bounded schedule regressions
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.15.2' || !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        run: |
          python3 -I -B tests/roadmap/outcome-accounting/test_report.py
          python3 -I -B tests/roadmap/outcome-accounting/test_schedules.py
          # Relink against this version's archive produced by the differential gate.
          rm -f tests/diff/.lake/build/bin/schedules
          (cd tests/diff && lake build schedules)
          (cd tests/diff && lake env lean ../roadmap/outcome-accounting/Check.lean)
          (cd tests/diff && lake env lean ../roadmap/outcome-accounting/Search.lean)
          (cd tests/diff && lake env lean ../roadmap/outcome-accounting/Schedule.lean)
          python3 scripts/schedules.py enumerate --example atomics --function mpRelAcq \
            --fuel 1000 --node-cap 4 --prefix-cap 128 --output "$RUNNER_TEMP/schedules.json"
          python3 scripts/schedules.py replay --receipt "$RUNNER_TEMP/schedules.json" \
            --output "$RUNNER_TEMP/schedule-replay.json"
          # Separate observed/enumeration coverage; the summary keeps qualified=false.
          python3 scripts/diff-report.py compare --summary "$RUNNER_TEMP/schedule-report.json" \
            --root "$PWD" --examples atomics --version "${{ matrix.zig }}" --host "$(uname -s)-$(uname -m)" \
            --schedule-receipts "$RUNNER_TEMP/schedules.json $RUNNER_TEMP/schedule-replay.json"
          python3 scripts/schedules.py replay --summary tests/diff/out/report.json \
            --example threads --function claimOnce --output "$RUNNER_TEMP/witness-replay.json"
          # P08: the relaxed message-passing race replays; limits stay unsolved.
          python3 -I -B tests/roadmap/counterexamples/test_e2e.py tests/diff/.lake/build/bin/schedules
          zig build-exe -OReleaseSafe -lc --dep common \
            -Mroot=tests/roadmap/outcome-accounting/Native.zig \
            -Mcommon=tests/diff/common.zig -femit-bin="$RUNNER_TEMP/outcome-native"
          python3 tests/roadmap/outcome-accounting/test_native.py "$RUNNER_TEMP/outcome-native"
          python3 tests/roadmap/outcome-accounting/test_parent_oom.py "$(command -v zig)"

      # After check.sh, Proofs/<Ex>/Gen.lean holds this version's translation: the proofs must
      # hold for it too (0.14.1 has its own `layout`, `variants` and `floatops` translations).
      - name: Build proofs
        if: ${{ !matrix.mutate }}
        run: |
          lake build Proofs
          if [ "${{ matrix.full }}" = "true" ] && [ "${{ matrix.zig }}" = "0.16.0" ]; then
            lake env lean --run tests/roadmap/rwlock-contracts/Runtime.lean
          fi

      # Qualify the complete Zig 0.16.0 Linux translation selected above. The explicit
      # assembly/libm policy is reviewed for this profile and the pinned Lean release.
      - name: Audit theorem dependencies and assumptions
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          rm -f "$RUNNER_TEMP/air2lean-assumptions.json"
          scripts/assumptions.sh --output "$RUNNER_TEMP/air2lean-assumptions.json"
          python3 scripts/float-semantics.py check-report "$RUNNER_TEMP/air2lean-assumptions.json"

      # Same premise tables over the kernel dependency graph of the audited translation.
      - name: Map audited theorems to premise IDs
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        run: |
          python3 -B scripts/premises.py compiled --assurance "$RUNNER_TEMP/air2lean-assumptions.json" \
            --output "$RUNNER_TEMP/air2lean-premises.json"

      # A03: real generated asm wrappers under a test-only interpretation, five wrapper
      # mutants, and the harness kept out of the audited theorem dependencies.
      - name: Generated asm wrappers, interpretation and mutations
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 tests/roadmap/asm-wrappers/harness.py --work "$RUNNER_TEMP/asm-wrappers"
          python3 tests/roadmap/asm-wrappers/audit.py --assurance "$RUNNER_TEMP/air2lean-assumptions.json"

      - name: Assurance environment regressions
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/proof-receipts/test_receipt.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/proof-receipts/test_check.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/proof-receipts/test_ci_stash.py
          tests/roadmap/assurance/check.sh

      # Claim strength is derived from extracted theorem types; overstated goals are rejected.
      - name: Claim strength regressions
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: tests/roadmap/claims/check.sh

      # Error returns satisfy a partial triple; every model failure constructor falsifies it.
      - name: Outcome taxonomy Lean fixture
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
        run: lake env lean tests/roadmap/outcome-taxonomy/Taxonomy.lean

      # Every tutorial: Main.lean and the solved exercise elaborate, the negative control fails
      # with its expected error. `lake build Proofs` above built the imported modules.
      - name: Tutorials
        if: ${{ !matrix.mutate }}
        run: python3 -B scripts/tutorials.py check --results "$RUNNER_TEMP/tutorials"

      - name: Integer bit operations regression and differential gate
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-0.16.0/bin/zig
          AIR2LEAN_ZIG: zig
          AIR2LEAN_BITOPS_OUT_DIR: ${{ runner.temp }}/air2lean-bitops
        run: tests/roadmap/bitops/check.sh

      # Check source-linked VCs against the pointer translation selected by check.sh.
      - name: Build optional verification conditions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vcs"
          lake build ZigLean.VC Proofs.Pointers.Gen 2>&1 | tee "$RUNNER_TEMP/vcs/build.log"

      - name: Result verification condition regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/vcs/Result.lean 2>&1 | tee "$RUNNER_TEMP/vcs/Result.log"

      - name: Memory verification condition regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/vcs/Memory.lean 2>&1 | tee "$RUNNER_TEMP/vcs/Memory.log"

      - name: Verification condition client regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/vcs/Clients.lean 2>&1 | tee "$RUNNER_TEMP/vcs/Clients.log"

      # Labelled switch loops share the same AIR contract in 0.14/0.15/0.16; 0.17.0 is not
      # yet a qualified dispatch profile (tests/roadmap/dispatch/check.sh rejects it).
      - name: Loop-switch dispatch regressions
        if: ${{ !matrix.mutate && matrix.zig == '0.14.1' || !matrix.mutate && matrix.zig == '0.15.2' || !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
          AIR2LEAN_DISPATCH_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_DISPATCH_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_DISPATCH_ZIG_STOCK: zig
        run: |
          if [ "$AIR2LEAN_DISPATCH_ZIG_VERSION" = "0.16.0" ]; then
            tests/roadmap/dispatch/check.sh
          else
            tests/roadmap/dispatch/check.sh --native-only
          fi

      - name: Local-place parent pointer regressions
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
          AIR2LEAN_LOCAL_PARENT_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_LOCAL_PARENT_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_LOCAL_PARENT_ZIG_STOCK: zig
        run: bash tests/roadmap/local-parent/check.sh

      # The complete review stack is required. Version-neutral parser/runtime regressions
      # and aggregate proofs use the modules selected above; exporter fidelity uses this Zig.
      - name: Review regressions
        if: ${{ !matrix.mutate }}
        env:
          AIR2LEAN_REVIEW_ZIG14: ${{ matrix.zig == '0.14.1' && format('{0}/zig-air-{1}/bin/zig', github.workspace, matrix.zig) || '' }}
          AIR2LEAN_REVIEW_ZIG15: ${{ matrix.zig == '0.15.2' && format('{0}/zig-air-{1}/bin/zig', github.workspace, matrix.zig) || '' }}
          AIR2LEAN_REVIEW_ZIG16: ${{ matrix.zig == '0.16.0' && format('{0}/zig-air-{1}/bin/zig', github.workspace, matrix.zig) || '' }}
          AIR2LEAN_REVIEW_ZIG17: ${{ matrix.zig == '0.17.0' && format('{0}/zig-air-{1}/bin/zig', github.workspace, matrix.zig) || '' }}
          AIR2LEAN_REVIEW_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
        run: scripts/review.sh

      - name: Weak CAS safety qualification
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_WEAK_CAS_ARTIFACT_DIR: ${{ runner.temp }}/weak-cas-qualification
        run: scripts/weak-cas.sh full

      - name: Check for sorry/admit/native_decide
        if: matrix.full
        run: scripts/no-sorry.sh

      # 0.15.2 on macOS: `Thread.Mutex` is `os_unfair_lock` (tests/golden/0.15.2/threadsync/
      # Gen-darwin.lean). The `threadsync` proofs hold for that translation too.
      - name: Build threadsync proofs (macOS translation)
        if: ${{ !matrix.mutate && matrix.zig == '0.15.2' }}
        run: |
          cp Proofs/Threadsync/Gen.lean "$RUNNER_TEMP/Gen-linux.lean"
          cp tests/golden/0.15.2/threadsync/Gen-darwin.lean Proofs/Threadsync/Gen.lean
          lake build Proofs.Threadsync.Mutex Proofs.Threadsync.WaitGroup Proofs.Threadsync.Handoff
          cp "$RUNNER_TEMP/Gen-linux.lean" Proofs/Threadsync/Gen.lean

      - name: Mutation check
        if: matrix.mutate
        env:
          AIR2LEAN_ZIG_AIR: zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_MUTATION_SHARD: ${{ matrix.shard }}
          AIR2LEAN_MUTATION_SHARDS: "5"
        run: scripts/mutate.sh

      # Keep the selected generated/profile context and final compiled library together.
      # This owns its sole guard; evidence stays outside cached .lake, with no upload.
      - name: Revision-bound theorem audit receipt
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate && runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          repo_root=$(python3 -c 'from pathlib import Path; print(Path.cwd().resolve())')
          cd "$repo_root"
          temp_root=$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True))' "$RUNNER_TEMP")
          lean_executable=$(elan which lean)
          lean_toolchain=$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True).parent.parent)' "$lean_executable")
          guard="$repo_root/scripts/build-guard.py"
          guard_sha=$(python3 -c 'import hashlib,sys; from pathlib import Path; print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())' "$guard")
          receipt_parent=$(mktemp -d "$temp_root/proof-receipt.XXXXXX")
          export AIR2LEAN_BUILD_LOCK="$temp_root/air2lean-build.lock"
          export PYTHONDONTWRITEBYTECODE=1
          # BEGIN proof receipt compiler stash
          compiler_stash=$(mktemp -d "$temp_root/proof-receipt-compilers.XXXXXX")
          restore_receipt_compilers() {
            original_status=$?
            trap - EXIT
            restore_failed=0
            for compiler in host-zig zig-air-0.16.0; do
              if [ -e "$compiler_stash/$compiler" ] || [ -L "$compiler_stash/$compiler" ]; then
                if [ -e "$repo_root/$compiler" ] || [ -L "$repo_root/$compiler" ]; then
                  echo "proof receipt compiler restore collision: $repo_root/$compiler; retained $compiler_stash/$compiler" >&2
                  restore_failed=1
                elif ! mv -T --no-clobber -- "$compiler_stash/$compiler" "$repo_root/$compiler"; then
                  echo "proof receipt compiler restore failed: $compiler_stash/$compiler" >&2
                  restore_failed=1
                elif [ -e "$compiler_stash/$compiler" ] || [ -L "$compiler_stash/$compiler" ]; then
                  echo "proof receipt compiler restore skipped; retained $compiler_stash/$compiler" >&2
                  restore_failed=1
                fi
              fi
            done
            if [ "$original_status" -eq 0 ] && [ "$restore_failed" -ne 0 ]; then original_status=2; fi
            exit "$original_status"
          }
          # Install before validation or either move; a partial setup also restores owned roots.
          trap restore_receipt_compilers EXIT
          python3 - "$repo_root" "$compiler_stash" <<'PYSTASH'
          from pathlib import Path
          import subprocess, sys
          root, stash = map(Path, sys.argv[1:])
          if root.resolve(strict=True) != root or stash.resolve(strict=True) != stash or stash.is_relative_to(root):
              raise SystemExit('proof receipt compiler stash requires physical paths outside the checkout')
          names = ('host-zig', 'zig-air-0.16.0')
          tracked = subprocess.run(['git', '-C', str(root), 'ls-files', '-z', '--', *names],
                                   check=True, stdout=subprocess.PIPE, timeout=5).stdout
          if tracked:
              raise SystemExit('proof receipt compiler roots contain tracked files')
          for name in names:
              path = root / name
              if path.is_symlink() or not path.is_dir() or path.resolve(strict=True) != path:
                  raise SystemExit('proof receipt compiler root must be a physical directory: ' + str(path))
          PYSTASH
          for compiler in host-zig zig-air-0.16.0; do
            mv -T --no-clobber -- "$repo_root/$compiler" "$compiler_stash/$compiler"
            if [ -e "$repo_root/$compiler" ] || [ -L "$repo_root/$compiler" ]; then
              echo "proof receipt compiler stash move incomplete: $repo_root/$compiler" >&2
              exit 2
            fi
          done
          # END proof receipt compiler stash
          bash tests/roadmap/proof-receipts/check.sh \
            --guard "$guard" --guard-sha256 "$guard_sha" \
            "$receipt_parent/attempt" "$lean_toolchain" ci-linux-0.16-all-shipped

  # Q05: native aarch64-macos evidence for the Darwin paths compatibility.json declares
  # (assurance/target-matrix.json, docs/target-matrix.md). One job without a matrix, since
  # macOS runner concurrency is limited; each evidence step binds AIR2LEAN_ZIG_VERSION.
  # WASM is not a declared target (T02/T05).
  macos:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stock aarch64-macos releases bootstrap zig-patch/build.sh and build the native
      # probes/harnesses. sha256 from https://ziglang.org/download/index.json
      # ("<version>" -> "aarch64-macos".shasum), confirmed by downloading and hashing each.
      - name: Install stock zig (aarch64-macos)
        run: |
          set -euo pipefail
          install_zig() {
            curl -fL --output "$RUNNER_TEMP/zig-$1.tar.xz" \
              "https://ziglang.org/download/$1/zig-aarch64-macos-$1.tar.xz"
            echo "$2  $RUNNER_TEMP/zig-$1.tar.xz" | shasum -a 256 -c -
            mkdir -p "$RUNNER_TEMP/host-zig-$1"
            tar -xJf "$RUNNER_TEMP/zig-$1.tar.xz" -C "$RUNNER_TEMP/host-zig-$1" --strip-components=1
            [ "$("$RUNNER_TEMP/host-zig-$1/zig" version)" = "$1" ]
          }
          install_zig 0.16.0 b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
          install_zig 0.15.2 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b

      # Builds and executes probe.zig for aarch64-macos-none (docs/profiles.md).
      - name: macOS ABI target probe (0.16.0)
        env:
          AIR2LEAN_ZIG_VERSION: "0.16.0"
        run: |
          set -euo pipefail
          python3 tests/roadmap/abi-probes/test_probe.py
          for mode in ReleaseSafe ReleaseFast; do
            python3 scripts/abi-probe.py observe --zig "$RUNNER_TEMP/host-zig-0.16.0/zig" \
              --profile "tests/roadmap/abi-probes/aarch64-macos-none-$mode.json" \
              --output "$RUNNER_TEMP/abi-aarch64-macos-none-$mode.json"
          done

      - name: Cache patched zig 0.16.0 (macOS)
        id: cache-zig-air-16
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-air-0.16.0/
          key: zig-air-macos-arm64-0.16.0-${{ hashFiles('zig-patch/air-json/*.zig', 'zig-patch/0.16.0/hook.patch', 'zig-patch/versions.toml', 'zig-patch/build.sh', 'zig-patch/lock.sh') }}

      - name: Cache patched zig 0.15.2 (macOS)
        id: cache-zig-air-15
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-air-0.15.2/
          key: zig-air-macos-arm64-0.15.2-${{ hashFiles('zig-patch/air-json/*.zig', 'zig-patch/0.15.2/hook.patch', 'zig-patch/versions.toml', 'zig-patch/build.sh', 'zig-patch/lock.sh') }}

      # One retry per version, as in the Linux job. The 7 GiB runner is below the 7.8/8 GB
      # bound that Zig's build.zig declares for compiling the compiler; --maxrss lets it start.
      - name: Build patched zig (macOS)
        if: steps.cache-zig-air-16.outputs.cache-hit != 'true' || steps.cache-zig-air-15.outputs.cache-hit != 'true'
        env:
          AIR2LEAN_ZIG_MAXRSS: "8000000000"
        run: |
          set -euo pipefail
          for v in 0.16.0 0.15.2; do
            if [ ! -x "zig-air-$v/bin/zig" ]; then
              PATH="$RUNNER_TEMP/host-zig-$v:$PATH" zig-patch/build.sh "$v" \
                || PATH="$RUNNER_TEMP/host-zig-$v:$PATH" zig-patch/build.sh "$v"
            fi
          done

      # zig-patch/versions.toml [ci.elan] pins elan v4.2.4's Linux asset; this is the same
      # release's aarch64-apple-darwin asset (sha256 = the release asset digest, confirmed).
      - name: Install elan (macOS)
        run: |
          set -euo pipefail
          curl -fL --output "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-aarch64-apple-darwin.tar.gz
          echo "7ad829861392c718dfebde3a83b5c8508df47be02af68894b094b0b3952616e5  $RUNNER_TEMP/elan.tar.gz" \
            | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build (macOS root package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-root-macos-arm64-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Cache Lake build (macOS tests/diff package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/diff/.lake
          key: lake-diff-macos-arm64-${{ hashFiles('tests/diff/lean-toolchain', 'tests/diff/lake-manifest.json') }}

      - name: Prune absent-source Lake modules
        run: python3 scripts/local-ci-steps.py --prune-cache

      - name: Build runtime library + translator (macOS)
        run: lake build

      # Fresh Darwin AIR export, compared with the goldens and their air-darwin/Gen-darwin
      # overrides, translated, built and differentially tested against native Zig (host-listed
      # float differences count as `host`, scripts/diff.sh). Rewrites Proofs/<Ex>/Gen.lean.
      - name: macOS golden AIR, translate, differential test (0.16.0)
        env:
          AIR2LEAN_CI: "1"
          AIR2LEAN_ZIG_VERSION: "0.16.0"
          AIR2LEAN_DIFF: "1"
          AIR2LEAN_ZIG: ${{ runner.temp }}/host-zig-0.16.0/zig
          AIR2LEAN_OUT_DIR: ${{ runner.temp }}/air-out/0.16.0
        run: scripts/check.sh

      - name: macOS proofs (0.16.0)
        env:
          AIR2LEAN_ZIG_VERSION: "0.16.0"
        run: lake build Proofs

      - name: Restore committed translations (0.16.0)
        run: git checkout -- Proofs

      # 0.15.2's Thread.Mutex is os_unfair_lock here: check.sh selects
      # tests/golden/0.15.2/threadsync/Gen-darwin.lean and the proofs build against it natively.
      - name: macOS golden AIR, translate, differential test (0.15.2)
        env:
          AIR2LEAN_CI: "1"
          AIR2LEAN_ZIG_VERSION: "0.15.2"
          AIR2LEAN_DIFF: "1"
          AIR2LEAN_ZIG: ${{ runner.temp }}/host-zig-0.15.2/zig
          AIR2LEAN_OUT_DIR: ${{ runner.temp }}/air-out/0.15.2
        run: scripts/check.sh

      - name: macOS proofs (0.15.2)
        env:
          AIR2LEAN_ZIG_VERSION: "0.15.2"
        run: lake build Proofs

      # The Darwin dumps are the source of tests/golden/<version>/<ex>/air-darwin/ overrides.
      - name: Upload the dumped Darwin AIR
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: air-macos-arm64
          path: ${{ runner.temp }}/air-out
          if-no-files-found: ignore
          retention-days: 7
