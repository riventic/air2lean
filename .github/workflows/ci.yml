name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run of the older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    # The 0.16.0 full job also runs the three T06 build-mode differential runs (~15 min).
    timeout-minutes: 90
    env:
      AIR2LEAN_EXAMPLES: ${{ matrix.examples }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full jobs: every example, the float probe, the diff test and the proofs.
          - zig: "0.16.0"
            examples: ""
            full: true
            mutate: false
          - zig: "0.15.2"
            examples: ""
            full: true
            mutate: false
          # 0.17.0 is in qualification (docs/zig-0.17-ci.md): a full job, but gates whose
          # source/native qualification is version-specific stay on their qualified versions.
          # The default and the mutation shards stay on 0.16.0 until 0.17.0 is qualified.
          - zig: "0.17.0"
            examples: ""
            full: true
            mutate: false
          # 0.14.1: `floatconv` is excluded (0.14.1 lowers `@intFromFloat` without the check,
          # zig-patch/0.14.1/TAGS.md), `slices` (no `@memmove`) and `lists` (its
          # `ArrayListUnmanaged` is another type, docs/std-models.md). Its std cannot build the
          # diff harness; the stale-Gen.lean check shows the translation is the one that the
          # full jobs test, and the proof step builds the proofs against it.
          - zig: "0.14.1"
            examples: "basic recursion options floatops floats errors variants pointers layout"
            full: false
            mutate: false
          # The mutation test, on the default version, in 5 jobs (one per line of
          # scripts/mutation-shards.txt): they run in parallel with the full jobs.
          # scripts/mutate.sh builds all it needs.
          - zig: "0.16.0"
            examples: ""
            full: false
            mutate: true
            shard: 1
          - zig: "0.16.0"
            examples: ""
            full: false
            mutate: true
            shard: 2
          - zig: "0.16.0"
            examples: ""
            full: false
            mutate: true
            shard: 3
          - zig: "0.16.0"
            examples: ""
            full: false
            mutate: true
            shard: 4
          - zig: "0.16.0"
            examples: ""
            full: false
            mutate: true
            shard: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Offline compiler inventory regressions
        run: python3 tests/roadmap/inventory/test_inventory.py

      # S2: the committed op table covers every normalizeOp tag and every Op constructor;
      # the classifier and the analyses that read it keep no wildcard arm.
      - name: Op effects table source checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/op-effects/test_op_table.py --self-test

      - name: Profile golden pipeline regressions
        run: python3 -B tests/roadmap/profiles/test_golden_pipeline.py

      # L14: emitted tags need a committed compiler-generated fixture (or an explicit
      # emitted-unfixtured request); rejected tags need the translator's reason and guidance.
      - name: Runtime tag fixture and guidance gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/coverage.py l14 coverage/0.14.1.json coverage/0.15.2.json coverage/0.16.0.json

      - name: Schedule exploration cap accounting regressions
        run: python3 -I -B tests/roadmap/schedule-caps/test_exploration.py

      - name: Counterexample bundle regressions
        run: python3 -I -B tests/roadmap/counterexamples/test_counterexample.py

      - name: Local Lake cache hygiene regressions
        run: python3 tests/roadmap/local-ci/test_cache.py

      # Fixture receipts/audits/diff summaries only; no Lean, Lake or Zig.
      - name: Verification coverage report regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/roadmap/coverage-report -p 'test_*.py' -v

      # Synthetic diff summaries only; capped/timer/unsupported outcomes refuse absence claims.
      - name: Outcome taxonomy regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/roadmap/outcome-taxonomy/test_taxonomy.py

      # Synthetic summaries and README/CI copies; excluded cases never reach the headline.
      - name: Host and skipped-case accounting regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/roadmap/host-accounting/test_accounting.py

      # Stub translator, Lake and audit; real build-guard and claims. No Lean, Lake or Zig.
      - name: Project check and reproducibility record regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/roadmap/project-check -p 'test_*.py' -v

      # I01 project.py export: stub compiler and translator (fixed point, unexported-root
      # reports, empty-export failure, flag preservation). The real-compiler case is skipped here.
      - name: Project export regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/roadmap/project-export -p 'test_*.py' -v

      # Offline: committed sources only. Fails when docs/support-matrix.md, README or PLAN
      # regions are stale or README, PLAN, ROADMAP, CI and the CLI help disagree.
      - name: Support matrix is current and consistent
        if: ${{ matrix.full && !matrix.mutate && matrix.zig == '0.16.0' }}
        run: |
          python3 scripts/support-matrix.py check
          python3 -m unittest discover -s tests/roadmap/support-matrix -v

      # Offline (Q05): each version x host x target x profile path that compatibility.json
      # declares maps to native execution, target probe and proof steps of a CI job on that
      # host; foreign-golden compilation does not count (docs/target-matrix.md).
      - name: Declared target matrix is natively backed
        if: ${{ matrix.full && !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/roadmap/target-matrix -v
          python3 scripts/target-matrix.py check --strict

      # Offline fixture repositories.
      - name: Artifact manifest provenance regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/artifact-manifest/test_manifest.py

      # Committed receipt-chained fixture (fresh schema-12 export, schema-2 receipt, native identity):
      # edit-one-link tests on copies plus the offline recheck. No Zig, Lake or Lean.
      # Heavy counterpart (local, guarded): scripts/provenance-evidence.py regenerate WORKDIR.
      - name: Provenance fixture edit-one-link tests and recheck
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/artifact-manifest/test_fixture.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/provenance-evidence.py check

      # Rebinding, mutant shapes and proof separation of the A03 asm-wrapper harness (no Lean).
      - name: Asm wrapper harness offline regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tests/roadmap/asm-wrappers -v
          python3 tests/roadmap/asm-wrappers/audit.py

      - name: Semantic fingerprint classification regressions
        run: python3 -I -B tests/roadmap/stable-generation/test_fingerprints.py

      - name: Modular output invalidation key regressions
        run: python3 -I -B tests/roadmap/modular-output/test_keys.py

      # Offline, over the committed Proofs/<Ex>/Gen.lean files the index describes.
      - name: Theorem premise reference and index
        run: |
          python3 -B tests/roadmap/premises/test_premises.py
          python3 -B scripts/premises.py check
          # F2/S1/H1: one theorem universe, kernel replay records and report freshness (no Lean).
          python3 -B tests/roadmap/theorem-universe/test_universe.py -v

      # W3: the real-allocator/Io inclusion checker and its committed evidence (the native and
      # model runs are local: tests/roadmap/model-inclusion/check.sh).
      - name: Model inclusion evidence
        run: |
          python3 -B tests/roadmap/model-inclusion/test_inclusion.py
          python3 -B tests/roadmap/model-inclusion/inclusion.py validate

      # Offline: tutorial layout, README sections and premise lists match the index.
      - name: Tutorial layout regressions
        run: python3 -B -m unittest discover -s tests/roadmap/tutorials -v

      # Offline, over the committed Gen.lean files whose hashes it compares: every listed
      # theorem has a current recorded check per translation, and no document labels a
      # single-step or single-schedule theorem as holding under every schedule.
      - name: Theorem inventory scope and check results
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/theorem-inventory/test_inventory.py
          python3 -B scripts/theorem-inventory.py check

      # V03: independent (non-Lean) structural validation of every committed golden AIR file,
      # then the stage trust report: each stage's class, premises, checkers and CI-run tests.
      - name: Independent AIR export validation and trust report
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/export-validation/test_validate_air.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/export-validation/test_trust_report.py
          python3 -B scripts/validate-air.py
          python3 -B scripts/trust-report.py check

      # Every numerical theorem states IEEE, compiler-rt@<versions> or abstract-spec semantics.
      - name: Float-semantics label regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/roadmap/float-semantics -v
          python3 scripts/float-semantics.py check

      # Q07: synthetic inventories and stub runners; consumes coverage.py diff, runs no compiler.
      - name: Upgrade qualification driver regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/roadmap/upgrade-qualification/test_qualify.py

      # Q02: every register ID maps to negative tests and designated mutants; complete rows
      # need both. The Python-side mutants run in memory against existing regressions.
      - name: Mutation map and Python-side mutants
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/mutation-map/test_mutation_map.py -v
          python3 -B scripts/mutation-map.py check
          python3 -B tests/roadmap/mutation-map/mutants.py

      # P02: the report script surfaces Lean errors and open obligations (no Lean is run).
      - name: Verification condition report script regressions
        run: python3 -B -m unittest discover -s tests/roadmap/vcs -p 'test_*.py' -v

      # Each optimize mode x backend pair has a qualification record (docs/build-modes.md).
      - name: Build-mode qualification records
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/roadmap/build-modes -v
          python3 -B scripts/build-modes.py check

      # Inspect checksum-pinned pristine sources even when a patched compiler is cached.
      - name: Check compiler-derived coverage inventory
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          source_temp=$(mktemp -d "$RUNNER_TEMP/air-inventory.XXXXXX")
          trap 'rm -rf "$source_temp"' EXIT
          url=$(zig-patch/toml-get.sh '["${{ matrix.zig }}"]' url)
          sha256=$(zig-patch/toml-get.sh '["${{ matrix.zig }}"]' sha256)
          curl -fL --output "$source_temp/source.tar.xz" "$url"
          echo "$sha256  $source_temp/source.tar.xz" | sha256sum -c -
          mkdir "$source_temp/source"
          tar -xJf "$source_temp/source.tar.xz" -C "$source_temp/source" --strip-components=1
          python3 scripts/coverage.py check --version '${{ matrix.zig }}' \
            --source "$source_temp/source" --os linux --inventory 'coverage/${{ matrix.zig }}.json'

      - name: Shell check regressions
        run: scripts/review-checks.sh

      - name: Build guard offline regressions
        run: |
          set -euo pipefail
          python3 tests/roadmap/build-budgets/test_guard.py 2>&1 | tee "$RUNNER_TEMP/build-guard-tests.log"

      # I08: stub-only interrupt/timeout/partial-write regressions for translate.sh, check.sh
      # and proof receipts (docs/safe-output.md); no compiler or Lean run.
      - name: Safe output and cancellation regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/roadmap/safe-output -p 'test_*.py' -v 2>&1 \
            | tee "$RUNNER_TEMP/safe-output-tests.log"

      # Q01 (docs/fuzzing.md): generator determinism, shrinker minimality against synthetic
      # oracles and typed Zig generator invariants; no translator, compiler or Lean run.
      - name: Fuzz generator and shrinker regressions
        run: tests/roadmap/fuzz/check.sh --light

      # X01 (docs/c-frontend.md): the committed C front-end coverage record matches the
      # corpus, its summary and the doc's generated tables; C generator invariants. The heavy
      # translate-c/AIR/Lean run is local: tests/roadmap/c-frontend/check.sh --heavy OUT_DIR.
      - name: C front-end coverage record check
        run: tests/roadmap/c-frontend/check.sh --light

      - name: Performance budget gate regressions
        run: |
          set -euo pipefail
          python3 tests/roadmap/perf-budgets/test_perf_budgets.py
          python3 scripts/perf-budgets.py validate

      - name: First-use workflow regressions
        run: python3 tests/usability/workflow.py

      - name: Release compatibility metadata and doctor regressions
        run: |
          set -euo pipefail
          python3 scripts/compat.py check
          python3 -m unittest discover -s tests/roadmap/distribution -v

      # Offline fixture repositories (docs/release-record.md). The ledger check verifies each
      # entry's reviewed revision and baseline hash; the shallow checkout fetches only those
      # commits. Local CI snapshots have no origin or history: structure only there.
      - name: Release record and review ledger regressions
        if: ${{ matrix.full && !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/roadmap/release-record -v
          if git remote get-url origin >/dev/null 2>&1; then
            read -r -a reviewed <<<"$(python3 scripts/release-record.py ledger --revisions)"
            git fetch --no-tags --depth=1 origin "${reviewed[@]}"
            python3 scripts/release-record.py ledger
          else
            python3 scripts/release-record.py ledger --allow-unfetched
          fi

      # Bootstrap zig for zig-patch/build.sh: it needs a host `zig` of the exact target
      # version on PATH (the Zig compiler source builds with its own release). Pinned in
      # zig-patch/versions.toml's [ci.host-zig."<version>"] table.
      - name: Install host zig
        run: |
          set -euo pipefail
          url=$(zig-patch/toml-get.sh '[ci.host-zig."${{ matrix.zig }}"]' url)
          sha256=$(zig-patch/toml-get.sh '[ci.host-zig."${{ matrix.zig }}"]' sha256)
          curl -fL --output host-zig.tar.xz "$url"
          echo "$sha256  host-zig.tar.xz" | sha256sum -c -
          mkdir -p host-zig
          tar -xJf host-zig.tar.xz -C host-zig --strip-components=1
          echo "$PWD/host-zig" >> "$GITHUB_PATH"

      # The float model follows the reference target (x86_64-linux); this checks that the
      # target still gives the results it depends on (docs/floats.md).
      - name: Float target probe
        if: matrix.full
        run: scripts/floatprobe.sh

      # Q05: 0.14.1's std cannot build the float probe's compat writer, so its target probe is
      # the bounded ABI probe against the 0.14.1 contracts (tests/roadmap/abi-probes/0.14.1/).
      - name: ABI target probe (0.14.1)
        if: ${{ matrix.zig == '0.14.1' && !matrix.mutate }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          for mode in ReleaseSafe ReleaseFast; do
            python3 scripts/abi-probe.py observe --zig "$PWD/host-zig/zig" \
              --profile "tests/roadmap/abi-probes/0.14.1/x86_64-linux-gnu-$mode.json" \
              --output "$RUNNER_TEMP/abi-x86_64-linux-gnu-$mode.json"
          done

      # Cache the patched compiler: zig-patch/build.sh takes a few minutes. Rebuild only when
      # the exporter, the version's hook, the version pin, or the build script itself changes.
      - name: Cache patched zig
        id: cache-zig-air
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-air-${{ matrix.zig }}/
          key: zig-air-${{ matrix.zig }}-${{ hashFiles('zig-patch/air-json/*.zig', format('zig-patch/{0}/hook.patch', matrix.zig), 'zig-patch/versions.toml', 'zig-patch/build.sh', 'zig-patch/lock.sh') }}

      # One retry: the compile step can go over the memory bound that build.zig declares
      # ("memory usage peaked at …"); the peak varies from run to run.
      - name: Build patched zig
        if: steps.cache-zig-air.outputs.cache-hit != 'true'
        run: zig-patch/build.sh ${{ matrix.zig }} || zig-patch/build.sh ${{ matrix.zig }}

      # elan installs `lake`/`lean` shims that read a package's lean-toolchain file (here:
      # leanprover/lean4:v4.34.0) and fetch that exact toolchain on first use. Installer
      # pinned in zig-patch/versions.toml's [ci.elan] table.
      - name: Install elan
        run: |
          set -euo pipefail
          url=$(zig-patch/toml-get.sh '[ci.elan]' url)
          sha256=$(zig-patch/toml-get.sh '[ci.elan]' sha256)
          curl -fL --output elan.tar.gz "$url"
          echo "$sha256  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz
          chmod +x elan-init
          ./elan-init --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Not the check trees (scripts/check-tree.py): each run derives them from this cache. The
      # exclusion only applies to matched entries, hence `.lake/*` rather than `.lake`.
      - name: Cache Lake build (root package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/*
            !.lake/check-tree
          key: lake-root-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Cache Lake build (tests/diff package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/diff/.lake
          key: lake-diff-${{ hashFiles('tests/diff/lean-toolchain', 'tests/diff/lake-manifest.json') }}

      - name: Prune absent-source Lake modules
        run: python3 scripts/local-ci-steps.py --prune-cache

      - name: Build runtime library + translator
        run: lake build

      # Every tracked generated module must be the current translator's output for its
      # committed AIR (docs/generated-code.md).
      - name: Generated modules are fresh translations of committed AIR
        run: |
          python3 -B tests/roadmap/gen-integrity/test_gen_integrity.py
          python3 -B scripts/gen-integrity.py check

      # --timing-json observes translator phases only: emitted Lean must stay byte-identical.
      - name: Translator timing flag preservation
        if: ${{ !matrix.mutate }}
        run: python3 -I -B tests/roadmap/perf-budgets/timing_cli.py --air2lean "$PWD/.lake/build/bin/air2lean"

      # Q06 (docs/perf-budgets.md): translate + elaborate every budgeted golden workload and fail
      # on a gross time/memory regression or any change of emitted Lean. Portable limits are
      # generous multiples of the recorded baseline so runner noise does not trip them.
      - name: Performance budget regression gate (portable)
        if: ${{ matrix.full && !matrix.mutate && matrix.zig == '0.16.0' }}
        run: |
          set -euo pipefail
          export LEAN_NUM_THREADS=1
          python3 -I -B scripts/perf-budgets.py record --no-build --skip-proof --out "$RUNNER_TEMP/perf.json"
          python3 -I -B scripts/perf-budgets.py gate --portable --measurement "$RUNNER_TEMP/perf.json" \
            --json "$RUNNER_TEMP/perf-findings.json"

      # docs/architecture-audit/trust-chain.md: every counterexample must stay fixed (schema table
      # and admission, module identity, unchecked memcpy, volatile asm, claim binding, emitter
      # placeholders).
      - name: Trust-chain audit counterexamples (fixed cases)
        if: ${{ !matrix.mutate }}
        run: |
          python3 -B tests/roadmap/architecture-audit/trust-chain/check.py --require-fixed \
            addrspace comptime-field build-mode legacy-default unknown-key missing-flag \
            std-name-spoof std-type-spoof unchecked-memcpy volatile-asm claims-unbound \
            reduce-bool-handedit

      # The sidecar flag must leave the committed Proofs/<Ex>/Gen.lean byte-identical.
      - name: Source maps and semantic fingerprints on golden AIR
        if: ${{ !matrix.mutate }}
        run: python3 -I -B tests/roadmap/stable-generation/test_cli.py "$PWD/.lake/build/bin/air2lean"

      - name: Modular output split and invalidation on golden AIR
        if: ${{ !matrix.mutate }}
        run: |
          python3 -I -B tests/roadmap/modular-output/test_cli.py "$PWD/.lake/build/bin/air2lean"
          lake env lean tests/roadmap/modular-output/Split.lean

      # V01 slice (docs/air-semantics.md): the certificate flag leaves Gen.lean byte-identical, the
      # committed Proofs/{Basic,Recursion}/AirCert.lean are current and kernel-check, their AIR is
      # the decoded golden AIR, and a one-operator AIR mutation breaks that function's theorem.
      - name: AIR semantics certificates
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          python3 -I -B tests/roadmap/air-semantics/test_cli.py "$PWD/.lake/build/bin/air2lean"
          lake build Proofs.Basic.AirCert Proofs.Recursion.AirCert Air2Lean.Main
          python3 -I -B tests/roadmap/air-semantics/test_lean.py "$PWD/.lake/build/bin/air2lean"

      - name: Stable scalar proof API regressions
        if: ${{ matrix.full && !matrix.mutate && matrix.zig == '0.15.2' || matrix.full && !matrix.mutate && matrix.zig == '0.16.0' }}
        run: |
          set -euo pipefail
          proof_api_dir="$RUNNER_TEMP/proof-api"
          mkdir -p "$proof_api_dir/tmp"
          export TMPDIR="$proof_api_dir/tmp"
          python3 -I -B tests/roadmap/proof-api/test_report.py 2>&1 | tee "$proof_api_dir/report.log"
          python3 -I -B tests/roadmap/proof-api/test_cli.py "$PWD/.lake/build/bin/air2lean" \
            --retain "$proof_api_dir/Generated.lean" 2>&1 | tee "$proof_api_dir/cli.log"
          for client in Generated.client Generated.renumbered.client Generated.unrelated.client; do
            lake env lean "$proof_api_dir/$client.lean" 2>&1 | tee "$proof_api_dir/$client.log"
          done
          mutation_status=0
          lake env lean "$proof_api_dir/Generated.changed.client.lean" \
            > "$proof_api_dir/mutation.log" 2>&1 || mutation_status=$?
          cat "$proof_api_dir/mutation.log"
          test "$mutation_status" -eq 1
          grep -Fq 'not definitionally equal' "$proof_api_dir/mutation.log"
          # Unfolding/step lemmas for every function, and name-only downstream clients.
          python3 -I -B tests/roadmap/proof-api/test_lemmas.py "$PWD/.lake/build/bin/air2lean" \
            --retain "$proof_api_dir/lemmas" 2>&1 | tee "$proof_api_dir/lemmas.log"
          for module in "$proof_api_dir"/lemmas/*.lean; do
            lake env lean "$module" 2>&1 | tee "$module.log"
          done
          # The same name-only client after a semantic change must fail.
          changed_status=0
          lake env lean "$proof_api_dir/lemmas/changed/Basic.lean" \
            > "$proof_api_dir/lemmas-changed.log" 2>&1 || changed_status=$?
          cat "$proof_api_dir/lemmas-changed.log"
          test "$changed_status" -eq 1
          grep -Fq 'not definitionally equal' "$proof_api_dir/lemmas-changed.log"

      - name: Public exporter filename qualification
        if: ${{ !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
        run: bash scripts/check-export-names.sh

      - name: Module identity regression (B1)
        if: ${{ !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/module-identity/Identity.lean
          bash tests/roadmap/module-identity/check.sh
          python3 -B tests/roadmap/architecture-audit/trust-chain/check.py --require-fixed std-name-spoof std-type-spoof

      - name: Instance identity (S1.1)
        if: ${{ !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/instance-identity/Instances.lean
          bash tests/roadmap/instance-identity/check.sh

      - name: Build optional separation proof tools
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof-tools"
          lake build ZigLean.Sep.Automation ZigLean.Sep.Total ZigLean.Sep.Cost ZigLean.Sep.Bounded ZigLean.Sep.Array ZigLean.Sep.Array.Reassemble ZigLean.Sep.Step Proofs.Slices.Gen 2>&1 | tee "$RUNNER_TEMP/proof-tools/build.log"

      - name: Separation normalization regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Normalize.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Normalize.log"

      - name: Separation client regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Clients.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Clients.log"

      - name: Explicit array framing regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Array.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Array.log"

      - name: Memory-backed array reassembly and generated clients
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Reassemble.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Reassemble.log"
          lake env lean tests/roadmap/proof-tools/ArrayClients.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/ArrayClients.log"

      - name: Symbolic-execution step regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Steps.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Steps.log"
          lake env lean tests/roadmap/proof-tools/StepClients.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/StepClients.log"

      - name: Total correctness regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake env lean tests/roadmap/proof-tools/Total.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Total.log"

      - name: Concrete runs of programs with loops (unroll_sched)
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          lake build ZigLean.Conc.Unroll Proofs.Threads.Gen 2>&1 | tee "$RUNNER_TEMP/proof-tools/unroll-build.log"
          lake env lean tests/roadmap/proof-tools/Unroll.lean 2>&1 | tee "$RUNNER_TEMP/proof-tools/Unroll.log"

      - name: Loop template, recursion, nested-loop, inference and range-conversion regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loop-tactics"
          lake build ZigLean.Sep.LoopTemplate ZigLean.RecTemplate ZigLean.Range Proofs.Lists.Sep Proofs.Recursion.Gen Proofs.Pointers.Gen air2lean 2>&1 | tee "$RUNNER_TEMP/loop-tactics/build.log"
          lake env lean tests/roadmap/loop-tactics/Template.lean 2>&1 | tee "$RUNNER_TEMP/loop-tactics/Template.log"
          lake env lean tests/roadmap/loop-tactics/Queue.lean 2>&1 | tee "$RUNNER_TEMP/loop-tactics/Queue.log"
          lake env lean tests/roadmap/loop-tactics/Infer.lean 2>&1 | tee "$RUNNER_TEMP/loop-tactics/Infer.log"
          lake env lean tests/roadmap/loop-tactics/Recursion.lean 2>&1 | tee "$RUNNER_TEMP/loop-tactics/Recursion.log"
          # Retained AIR of a nested loop: retranslate, compare, kernel-check the proof.
          bash tests/roadmap/loop-tactics/nested/check.sh 2>&1 | tee "$RUNNER_TEMP/loop-tactics/Nested.log"

      - name: Memory-model hardening regressions (MM-5, MM-11, MM-13, MM-14)
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/memory-hardening"
          lake build ZigLean.Mem.Lemmas Proofs.Variants.Gen Proofs.Layout.Gen 2>&1 | tee "$RUNNER_TEMP/memory-hardening/build.log"
          for test in tests/roadmap/memory-hardening/*.lean; do
            lake env lean "$test" 2>&1 | tee "$RUNNER_TEMP/memory-hardening/$(basename "$test" .lean).log"
          done

      - name: Validate AIR input and whole-program signatures
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/input-validation"
          mkdir -p "$evidence_dir/tmp"
          export TMPDIR="$evidence_dir/tmp"
          lake env lean tests/roadmap/input-validation/Validation.lean 2>&1 | tee "$evidence_dir/api.log"
          python3 tests/roadmap/input-validation/test_cli.py "$PWD/.lake/build/bin/air2lean" 2>&1 | tee "$evidence_dir/cli.log"
          # MM-6: no emitter placeholder succeeds; formerly reachable arms are checker rejections.
          python3 tests/roadmap/emitter-placeholders/test_cli.py "$PWD/.lake/build/bin/air2lean" 2>&1 | tee "$evidence_dir/placeholders.log"
          lake env lean --run tests/roadmap/emitter-placeholders/Gate.lean 2>&1 | tee "$evidence_dir/placeholder-gate.log"

      # Q01: committed shrunk reproducers, then a small seeded malformed-AIR budget; any
      # failure is shrunk into $RUNNER_TEMP/air-fuzz/failures (docs/fuzzing.md).
      - name: Malformed AIR JSON fuzzing
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          fuzz_dir="$RUNNER_TEMP/air-fuzz"
          mkdir -p "$fuzz_dir/tmp"
          export TMPDIR="$fuzz_dir/tmp"
          tests/roadmap/fuzz/check.sh --air "$PWD/.lake/build/bin/air2lean" 300 "$fuzz_dir/failures" 2>&1 \
            | tee "$fuzz_dir/fuzz.log"

      # Q01 heavy differential, capped at 3 seeds: generated Zig is run natively (stock Zig),
      # exported with the patched compiler, translated, and the Lean values must equal native.
      # Larger ranges are a manual job (docs/fuzzing.md).
      - name: Generated Zig differential fuzzing
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_FUZZ_HEAVY_MAX: "3"
        run: tests/roadmap/fuzz/check.sh --heavy "$RUNNER_TEMP/zig-fuzz" 0 3

      # L12: explicit `ExternInit` external initial state, generated-client proofs and
      # rejection of every absent/partly undefined global initializer. Hand-written AIR only.
      - name: Global initialization and external initial state
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          lake build ZigLean.Sep
          bash tests/roadmap/global-init/check.sh

      # Q01 fuzz seeds 18/19/39: comptime-resolved locals (dead address-0 placeholders dropped,
      # a read one rejected); retained translations, native-value guards and a native zig test.
      - name: Comptime-resolved locals
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
        run: |
          set -euo pipefail
          bash tests/roadmap/const-locals/check.sh
          bash tests/roadmap/const-locals/check.sh --native

      # G1: extern calls bound to translated `export fn` definitions (evaluated per Zig version)
      # or to a registry model with a premise; CALLEE_EXTERN_UNBOUND otherwise. Committed AIR only.
      - name: Extern C calls
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          lake build ZigLean
          bash tests/roadmap/extern-calls/check.sh

      - name: Validate check-only diagnostic collection
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          diagnostics_evidence_dir="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics_evidence_dir/tmp"
          export TMPDIR="$diagnostics_evidence_dir/tmp"
          lake env lean tests/roadmap/diagnostics/Collector.lean 2>&1 | tee "$diagnostics_evidence_dir/collector.log"
          lake env lean --run tests/roadmap/diagnostics/RuntimeTags.lean 2>&1 | tee "$diagnostics_evidence_dir/runtime-tags.log"
          python3 tests/roadmap/diagnostics/test_cli.py --self-test 2>&1 | tee "$diagnostics_evidence_dir/harness.log"
          python3 tests/roadmap/diagnostics/test_cli.py "$PWD/.lake/build/bin/air2lean" 2>&1 | tee "$diagnostics_evidence_dir/cli.log"
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/blocker-collection/test_cli.py "$PWD/.lake/build/bin/air2lean" 2>&1 | tee "$diagnostics_evidence_dir/blockers.log"
          # I05 source spans: real exports of the fixture must locate each marked statement.
          bash tests/roadmap/diagnostics-complete/export.sh "$PWD/zig-air-${{ matrix.zig }}/bin/zig" "$diagnostics_evidence_dir/air"
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/diagnostics-complete/test_cli.py "$PWD/.lake/build/bin/air2lean" \
            --export-air "$diagnostics_evidence_dir/air" 2>&1 | tee "$diagnostics_evidence_dir/complete.log"
      # L13: exporter-schema fixtures, the default rejection, the reviewed asm allowlist
      # (ASM_VOLATILE_EFFECT) and the opt-in device contract; fresh real exports of the fixtures
      # with the patched compiler; device-trace proofs on the generated UART driver and rdtsc
      # client and their semantic mutants (docs/volatile-effects.md).
      - name: Volatile rejection and device effects
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 tests/roadmap/volatile-effects/test_cli.py --self-test
          python3 tests/roadmap/volatile-effects/test_cli.py "$PWD/.lake/build/bin/air2lean"
          volatile_air=$(mktemp -d "$RUNNER_TEMP/volatile-export.XXXXXX")
          ZIG_AIR_JSON_DIR="$volatile_air" ZIG_AIR_JSON_FILTER=volatile_effects. "$AIR2LEAN_ZIG_AIR" \
            build-obj -fno-emit-bin -OReleaseSafe -fno-error-tracing -target x86_64-linux -mcpu=baseline \
            tests/roadmap/volatile-effects/volatile_effects.zig
          python3 tests/roadmap/volatile-effects/test_cli.py --export-dir "$volatile_air" "$PWD/.lake/build/bin/air2lean"
          bash tests/roadmap/volatile-effects/check-device.sh
          bash tests/roadmap/volatile-effects/check-device.sh --export "$(mktemp -d "$RUNNER_TEMP/device-export.XXXXXX")"
      # A cmpxchg or RMW .Max/.Min on a padded integer width compares the whole ABI cell
      # natively: rejected with PADDED_ATOMIC (docs/diagnostics.md). Hand-written AIR only.
      - name: Reject padded-width atomic comparisons
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/padded-atomics/test_cli.py --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/padded-atomics/test_cli.py "$PWD/.lake/build/bin/air2lean"

      # Zig's shift-count safety check (`shiftRhsTooBig`) maps to `.overflow`: committed
      # patched-compiler AIR for 0.14.1, 0.15.2 and 0.16.0, no compiler needed.
      - name: Shift-count panic mapping
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: python3 -B tests/roadmap/bitops-native/shift-panic/test_cli.py "$PWD/.lake/build/bin/air2lean"

      # S2: `air2lean --print-op-table` is the committed coverage/op-table/op-table.json, and an
      # unknown or unlisted tag is rejected rather than decoded or skipped.
      - name: Op effects table and unknown-tag rejection
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/op-effects/test_op_table.py "$PWD/.lake/build/bin/air2lean"

      # Partly `undefined` constant operands: explicit undefined bytes in a store, generated-
      # client proofs that reading them is `.unspecified`, and rejection of every other
      # `undefined` operand. A store of `undefined` to a local: byte locals whose undefined
      # parts read as `.unspecified`, copied without decoding. Hand-written AIR only.
      - name: Undefined constant operands
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          lake build ZigLean
          bash tests/roadmap/undef-operands/check.sh
          bash tests/roadmap/undef-locals/check.sh
      # Illegal behaviour (docs/illegal-behavior.md): each op's own check gives `.illegal` on the
      # retained 0.16.0 fixtures, emitter mutants that drop a check are killed, translator
      # probes, and the trust-chain audit's unchecked-memcpy case stays fixed.
      - name: Illegal behaviour
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          bash tests/roadmap/illegal-behavior/check.sh
      # noalias parameters (docs/illegal-behavior.md row 43): overlapping calls are `.illegal`,
      # disjoint ones return values, an escaping noalias pointer is rejected.
      - name: noalias parameters
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          bash tests/roadmap/noalias/check.sh
      # L08: bit-pointer accesses with defined-bit masks, generated-client proofs and
      # PACKED_LAYOUT rejections. Hand-written AIR only.
      - name: Packed fields and bit-pointers
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          lake build ZigLean
          bash tests/roadmap/packed-fields/check.sh
      # B1: tagged unions with a `noreturn` variant; committed 0.16.0/0.15.2 exports, kernel
      # proofs of the native values and fail-closed rejections. Runs no compiler.
      - name: Noreturn union variants
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          lake build ZigLean
          bash tests/roadmap/noreturn-variants/check.sh
      - name: First-use CLI diagnostics
        run: python3 tests/usability/cli.py

      # Synthetic 0.17.0 AIR (no compiler output): tag table, @divCeil, new/renamed tag
      # translation and rejections, and the 0.16.0 goldens rewritten to 0.17.0 spelling.
      - name: Zig 0.17.0 translator regressions
        if: ${{ !matrix.mutate && matrix.zig == '0.17.0' }}
        run: |
          set -euo pipefail
          lake env lean --run tests/roadmap/zig017/Tags.lean
          python3 -B tests/roadmap/zig017/test_cli.py "$PWD/.lake/build/bin/air2lean" --elaborate

      # Logical-order @bitCast (docs/bitcast-semantics.md): the committed 0.17.0 AIR, its
      # translation, the ZigLean.BitCast lemmas, and the same cases natively with stock 0.17.0.
      - name: Zig 0.17.0 bitcast semantics
        if: ${{ !matrix.mutate && matrix.zig == '0.17.0' }}
        run: |
          set -euo pipefail
          tests/roadmap/bitcast-017/check.sh
          AIR2LEAN_ZIG_NATIVE="${{ github.workspace }}/host-zig/zig" tests/roadmap/bitcast-017/check.sh --native
          # @divCeil: committed compiler-exported AIR, translation and native differential.
          AIR2LEAN_ZIG_NATIVE="${{ github.workspace }}/host-zig/zig" tests/roadmap/zig017/divceil/check.sh

      # Registry fixtures are version neutral; check their typed imported evidence and client
      # once, with generated files/logs isolated from the checkout. No additional upload.
      - name: External model contracts
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_MODEL_EVIDENCE: ${{ runner.temp }}/model-contracts
        run: |
          python3 tests/roadmap/models/test_gate.py
          python3 -B tests/roadmap/models/test_external_contracts.py
          python3 -B tests/roadmap/models/test_std_sources.py
          scripts/model-contracts.sh

      # E03: selected environment-operation contract and its write-all client; the
      # documentation check requires an operation-to-premise row and the not-claimed list.
      # check.sh also translates the committed std I/O AIR (0.15.2 fs.File/posix, 0.16.0
      # posix.read/closeFd) with only os.linux.{read,write,close} bound (ENV-03) and checks the
      # proofs about the generated code. Fresh export: tests/roadmap/env-boundaries/export.sh.
      - name: Environment-operation boundary
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        run: |
          set -euo pipefail
          lake build ZigLean ZigLean.Env ZigLean.Env.Linux air2lean
          bash tests/roadmap/env-boundaries/check.sh

      # This checks committed Flow artifacts only: no production checkout, Zig export,
      # native reproduction, or claim about compiler preservation is part of this CI gate.
      - name: Flow timestamp artifact-only proofs and provenance guards
        if: matrix.full && matrix.zig == '0.16.0'
        env:
          TMPDIR: ${{ runner.temp }}
          FLOW_TIME_SOURCE: ${{ runner.temp }}/absent-flow-checkout/time.zig
        run: |
          set -euo pipefail
          python3 tests/roadmap/flow-time/test_provenance.py
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ripgrep
          fi
          bash scripts/flow-time.sh --check-artifacts

      # The portable gate checks all supported synthetic signatures without invoking Zig.
      # Full 0.16 qualification also exports baseline Linux AIR and executes finite native calls.
      # Detailed evidence stays in RUNNER_TEMP, outside the cached .lake tree; no upload step.
      - name: Progress hint qualification
        if: ${{ !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_PROGRESS_ARTIFACT_DIR: ${{ runner.temp }}/progress-qualification
        run: |
          if [ '${{ matrix.zig }}' = '0.16.0' ]; then
            scripts/progress-hints.sh full
          else
            scripts/progress-hints.sh
          fi

      - name: Finite progress kernel contracts
        if: ${{ matrix.full && !matrix.mutate }}
        run: lake env lean tests/roadmap/progress/Total.lean

      # Opt-in timed interpreter only: no translated source call, OS clock or futex backend.
      - name: Deadline case contracts and solver budget path
        if: ${{ matrix.full && !matrix.mutate }}
        run: |
          set -euo pipefail
          lake build ZigLean.Conc.TimedBudget ZigLean.Conc.TimedCall
          lake env lean tests/roadmap/deadline-cases/Contracts.lean
          lake env lean --run tests/roadmap/deadline-cases/Runtime.lean
          # Boundary and recheck mutants of the budget path must fail its soundness proofs.
          python3 -B tests/roadmap/deadline-cases/mutations.py

      # Translated worker idle loop: safety under every schedule, progress only under the
      # explicit THR-09 fairness premise, and a starving schedule (docs/progress-hints.md).
      - name: Worker idle-loop safety, fairness-premised progress and starvation
        if: ${{ matrix.full && !matrix.mutate }}
        run: bash tests/roadmap/idle-loops/check.sh

      # C02: thread-local storage. Retained 0.16.0/0.15.2 exports translate unchanged; per-thread
      # counters over every schedule; a use after the owning thread ended never returns.
      - name: Thread-local storage instances, initialization and lifetime
        if: ${{ matrix.full && !matrix.mutate }}
        run: |
          set -euo pipefail
          lake build ZigLean.Conc.TlsLemmas
          bash tests/roadmap/thread-locals/check.sh

      # Translation and input/output hash checks; declared proof goals remain unverified.
      - name: Project manifest regressions and example translation
        if: matrix.full && matrix.zig == '0.16.0'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/roadmap/project -v
          # Consumer mocks need no diagnostic producer; actual integration requires PR 78.
          python3 -m unittest discover -s tests/roadmap/project-diagnostics -v
          # I02: dependency closure fixtures and every committed golden closed or modelled.
          python3 -m unittest discover -s tests/roadmap/dependency-closure -v
          python3 scripts/project.py closure example-project.json --format text
          python3 scripts/dependency-closure.py goldens --format text
          # I01: original-source export of examples/basic with the patched compiler (closure fixed point).
          AIR2LEAN_ZIG_AIR="$PWD/zig-air-0.16.0/bin/zig" AIR2LEAN_TRANSLATOR="$PWD/.lake/build/bin/air2lean" \
            python3 -m unittest discover -s tests/roadmap/project-export -k RealCompilerTest -v
          work="$(mktemp -d "${RUNNER_TEMP}/air2lean-project.XXXXXX")"
          python3 scripts/project.py translate example-project.json \
            --translator .lake/build/bin/air2lean --out "$work/artifact" \
            > "$work/translation.json"
          python3 scripts/project.py verify example-project.json \
            --artifact "$work/artifact" > "$work/verification.json"
          cat "$work/verification.json"
          python3 scripts/project-diagnostics.py check example-project.json \
            --translator .lake/build/bin/air2lean --out "$work/diagnostics.json" \
            > "$work/diagnostics-stdout.json"
          cmp "$work/diagnostics.json" "$work/diagnostics-stdout.json"
          python3 - "$work/diagnostics.json" <<'PY_CHECK'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              report = json.load(stream)
          assert report['schema'] == 1 and report['kind'] == 'air2lean-project-diagnostics'
          assert report['status'] == 'checked' and report['complete'] and not report['truncated']
          assert report['proof_status'] == 'not_run' and report['runtime_outcomes'] == 'not_observed'
          assert report['source_correspondence'] == 'not_attested'
          assert report['producer_protocol']['qualification'] == 'not_attested_by_adapter'
          assert report['root_checks'] and all(
              root['status'] == 'checked' and root['producer']['status'] == 'checked'
              for root in report['root_checks'])
          PY_CHECK

      - name: Nullable mutation classifier regressions
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        run: python3 -B tests/roadmap/null-pointers/test_classify_mutant.py

      # The scalar C/allowzero fragment is qualified on 0.16.0. Use this job's
      # patched exporter and separately installed matching shipping compiler.
      - name: Scalar nullable pointer source and semantic gate
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_NULL_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_NULL_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_NULL_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_NULL_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
        run: tests/roadmap/null-pointers/check.sh

      - name: Byte sentinel allocation source, ownership and kernel mutations
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_SENTINEL_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_SENTINEL_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_SENTINEL_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
        run: |
          python3 -B tests/roadmap/byte-sentinel/static.py
          bash tests/roadmap/byte-sentinel/check.sh

      - name: Sentinel reallocation, raw allocator contracts and realloc recognition
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_SENTINEL_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_SENTINEL_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_SENTINEL_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
        run: bash tests/roadmap/sentinel-realloc/check.sh

      # Selected policy correspondence on the native 64-bit reference CI host. Keep
      # reports in RUNNER_TEMP, outside cached .lake directories; no artifact upload.
      - name: Allocation policy proofs, correspondence and semantic mutations
        if: matrix.full
        env:
          AIR2LEAN_ALLOCATION_REPORT_DIR: ${{ runner.temp }}/allocation-policy-${{ matrix.zig }}
        run: |
          set -euo pipefail
          mkdir -p "$AIR2LEAN_ALLOCATION_REPORT_DIR"
          cp docs/allocation-policy-report.json "$AIR2LEAN_ALLOCATION_REPORT_DIR/source-qualification-status.json"
          python3 tests/roadmap/allocation-policy/static.py 2>&1 | tee "$AIR2LEAN_ALLOCATION_REPORT_DIR/static.log"
          bash tests/roadmap/allocation-policy/check.sh 2>&1 | tee "$AIR2LEAN_ALLOCATION_REPORT_DIR/check.log"
          python3 tests/roadmap/allocation-policy/mutations.py 2>&1 | tee "$AIR2LEAN_ALLOCATION_REPORT_DIR/mutations.log"

      # M01: allocator identity, arena/fixed-buffer policies and the arena client proof.
      - name: Allocator identity proofs and model regressions
        if: ${{ !matrix.mutate }}
        run: bash tests/roadmap/allocator-identity/check.sh

      # M05: opt-in address reuse, lifetime safety from provenance, stale @ptrFromInt.
      - name: Address reuse proofs and model regressions
        if: ${{ !matrix.mutate }}
        run: bash tests/roadmap/address-reuse/check.sh

      # L06: nested constant pointer bases (ZigLean/Mem/ConstPtr.lean, proof-only): retained
      # translation, generated-client proofs and CLI rejections; the native stage2_x86_64 run.
      - name: Nested constant pointer bases (L06)
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
        run: |
          set -euo pipefail
          lake build ZigLean ZigLean.Mem.ConstPtr Air2Lean air2lean
          bash tests/roadmap/const-bases/check.sh
          bash tests/roadmap/const-bases/check.sh --native

      # C01's checked source/export/proof fragment is qualified on 0.16.0.
      # Fresh exports use the pinned patched compiler; native tests use stock Zig.
      - name: Thread tuple source and ownership gate
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
          AIR2LEAN_TUPLE_ZIG_VERSION: ${{ matrix.zig }}
        run: |
          set -euo pipefail
          lake build ZigLean.Conc.Csl ZigLean.Conc.Transfer ZigLean.Sep
          python3 tests/roadmap/thread-tuples/guard-tests.py
          python3 tests/roadmap/thread-tuples/mutation-tests.py
          [ "$("$AIR2LEAN_ZIG_AIR" version)" = "$AIR2LEAN_TUPLE_ZIG_VERSION" ]
          [ "$("$AIR2LEAN_ZIG_NATIVE" version)" = "$AIR2LEAN_TUPLE_ZIG_VERSION" ]
          work=$(mktemp -d "$RUNNER_TEMP/thread-tuples.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          bash tests/roadmap/thread-tuples/check.sh --export "$work/air"
          "$AIR2LEAN_TRANSLATOR" "$work/air" -o "$work/Gen.lean" --namespace ThreadTuples --prefix thread_tuples.
          python3 scripts/normalize-generated.py report "$work/Gen.lean" "$work/air" "$work/generated-report.json"
          python3 scripts/normalize-generated.py compare tests/roadmap/thread-tuples/ThreadTuples/Gen.lean "$work/Gen.lean" "$work/generated-report.json"
          lake env lean -R "$work" "$work/Gen.lean"
          bash tests/roadmap/thread-tuples/check.sh --native
          bash tests/roadmap/thread-tuples/check.sh --check-artifacts
          bash tests/roadmap/thread-tuples/check.sh --adapter-contract "$work/adapter-contract"

      - name: Fallible thread assignment and group fallback gate
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
          AIR2LEAN_SPAWN_VERSION: ${{ matrix.zig }}
          AIR2LEAN_SPAWN_ARTIFACT_DIR: ${{ runner.temp }}/spawn-failure
        run: |
          set -euo pipefail
          python3 tests/roadmap/spawn-failure/harness-tests.py
          bash tests/roadmap/spawn-failure/check.sh --full

      - name: Io.Future model, proofs and schedules (C08)
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
        run: |
          set -euo pipefail
          lake build ZigLean.Conc.FutureLemmas
          work=$(mktemp -d "$RUNNER_TEMP/futures.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          bash tests/roadmap/futures/check.sh --export "$work/export"
          bash tests/roadmap/futures/check.sh --native
          bash tests/roadmap/futures/check.sh --check-artifacts
          lake env lean --run tests/roadmap/models/StdModels.lean

      - name: Finite symbolic error-storage model and checker controls
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          storage_evidence_dir="$RUNNER_TEMP/error-storage-controls"
          mkdir -p "$storage_evidence_dir"
          lake build ZigLean.Mem.Lemmas ZigLean.Sep.Try ZigLean.Sep.Discard
          lake env lean --run tests/roadmap/error-storage/Qualifier.lean
          lake env lean --run tests/roadmap/error-storage/GlobalAlias.lean
          lake env lean --run tests/roadmap/error-storage/Runtime.lean
          lake env lean --run tests/roadmap/error-storage/Pipeline.lean "$storage_evidence_dir/Synthetic.lean"
          lake env lean -R "$storage_evidence_dir" "$storage_evidence_dir/Synthetic.lean"

      # L10: error-code widths. Width-quantified proofs (proof-only module) and the
      # hand-written 16/8/10/17-bit fixtures; only the default width has native evidence.
      - name: Error-code widths (--error-limit) proofs, fixtures and rejections
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          lake build ZigLean ZigLean.Mem.ErrWidthLemmas Air2Lean air2lean
          bash tests/roadmap/error-width/check.sh

      # L09: this host's (x86_64-linux, LLVM) vector memory images against the model's
      # encoding, the recorded aarch64-macos images, and the checker's backend gate; lane
      # pointers: the native lanes.zig test, a fresh export, the committed translations,
      # theorems and kernel-checked runs.
      - name: Vector memory layouts, compiler probe, lane pointers and checker controls
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
        run: |
          set -euo pipefail
          lake build ZigLean ZigLean.VecMem Air2Lean air2lean
          observed="$RUNNER_TEMP/vector-layouts-x86_64-linux-ReleaseSafe.txt"
          host-zig/zig run -fllvm -OReleaseSafe tests/roadmap/vector-layouts/probe.zig 2> "$observed"
          lake env lean --run tests/roadmap/vector-layouts/Model.lean "$observed"
          lake env lean --run tests/roadmap/vector-layouts/Model.lean tests/roadmap/vector-layouts/aarch64-macos-ReleaseSafe.txt
          lake env lean --run tests/roadmap/vector-layouts/Checker.lean
          bash tests/roadmap/vector-layouts/lanes.sh --native
          bash tests/roadmap/vector-layouts/lanes.sh --export "$RUNNER_TEMP/vector-lanes"
          bash tests/roadmap/vector-layouts/lanes.sh
          host-zig/zig test -fllvm -OReleaseSafe tests/roadmap/vector-layouts/lane_reads.zig
          python3 tests/roadmap/vector-layouts/test_lane_reads.py "$PWD/.lake/build/bin/air2lean"

      # L07: Zig ≤0.16 representation casts and optional-pointer rules: retained translation,
      # proofs, checker version gate, and this host's native probe against the model.
      - name: Aggregate representation casts and optional-pointer rules
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
        run: |
          set -euo pipefail
          lake build ZigLean ZigLean.ReprCast Air2Lean air2lean
          export AIR2LEAN_LEAN=$(lake env which lean)
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          bash tests/roadmap/aggregate-casts/check.sh --native

      # T04: the recorded aarch64-linux-gnu and aarch64-macos-none results (observed natively
      # by the aarch64-linux and macos jobs) against the model, with kernel-checked layout
      # tables per profile; their vector images against L09's encoding (docs/aarch64-abi.md).
      - name: aarch64 ABI profile proofs (T04)
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        run: |
          set -euo pipefail
          lake build ZigLean.VecMem ZigLean.Float.Allowed
          python3 -m unittest discover -s tests/roadmap/aarch64-abi -p 'test_*.py' -v
          lake env lean --run tests/roadmap/aarch64-abi/Model.lean aarch64-linux-gnu \
            tests/roadmap/aarch64-abi/expected/0.16.0/aarch64-linux-gnu-ReleaseSafe.txt
          lake env lean --run tests/roadmap/aarch64-abi/Model.lean aarch64-macos-none \
            tests/roadmap/aarch64-abi/expected/0.16.0/aarch64-macos-none-ReleaseSafe.txt
          for expected in tests/roadmap/aarch64-abi/expected/0.16.0/*.txt; do
            grep -E '^(vector|lane|load|pad) ' "$expected" > "$RUNNER_TEMP/vectors.txt"
            lake env lean --run tests/roadmap/vector-layouts/Model.lean "$RUNNER_TEMP/vectors.txt"
          done

      # Source/native correspondence is bounded to explicit stage2_x86_64 Linux16.
      - name: Global payload source, generated clients and semantic mutations
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_ZIG_BACKEND: stage2_x86_64
        run: |
          set -euo pipefail
          lake build ZigLean Air2Lean air2lean
          lake env lean tests/roadmap/global-payload-pointers/ExceptEq.lean
          python3 -m unittest discover -s tests/roadmap/global-payload-pointers -v
          export AIR2LEAN_LEAN=$(lake env which lean)
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          bash tests/roadmap/global-payload-pointers/check.sh --kernel
          bash tests/roadmap/global-payload-pointers/check.sh --native
          fresh=$(mktemp -d "$RUNNER_TEMP/air2lean-global-payload-source.XXXXXX")
          trap 'rm -rf "$fresh"' EXIT
          bash tests/roadmap/global-payload-pointers/check.sh --export "$fresh/air"
          bash tests/roadmap/global-payload-pointers/check.sh --export-reject "$fresh/reject-air"
          .lake/build/bin/air2lean "$fresh/air" -o "$fresh/Gen.lean" --namespace GlobalPayload --prefix global_payloads.
          python3 scripts/normalize-generated.py report "$fresh/Gen.lean" "$fresh/air" "$fresh/generated-report.json"
          AIR2LEAN_GLOBAL_ACTUAL_GEN="$fresh/Gen.lean" AIR2LEAN_GLOBAL_CLIENT_OUT="$fresh/clients" \
            bash tests/roadmap/global-payload-pointers/check-generated.sh

      # L04 actual compiler/native qualification is currently specific to 0.16.0.
      # 0.14/0.15 exporter APIs were source-inspected; their synthetic fixtures are
      # checked in this gate, without claiming native/export qualification for them.
      - name: Pointer try ownership, native and fresh source regressions
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          lake build ZigLean.Sep.Try ZigLean.Sep.Discard
          python3 -m unittest discover -s tests/roadmap/try-pointers -v
          bash tests/roadmap/try-pointers/check.sh --check-artifacts
          bash tests/roadmap/try-pointers/check.sh --native
          fresh=$(mktemp -d "$RUNNER_TEMP/air2lean-pointer-try-source.XXXXXX")
          trap 'rm -rf "$fresh"' EXIT
          bash tests/roadmap/try-pointers/check.sh --export "$fresh/air"
          python3 tests/roadmap/try-pointers/check-artifacts.py --fresh-air "$fresh/air"
          "$AIR2LEAN_TRANSLATOR" "$fresh/air" -o "$fresh/Gen.lean" \
            --namespace TryPointers --prefix try_pointers.
          python3 scripts/normalize-generated.py report "$fresh/Gen.lean" "$fresh/air" "$fresh/generated-report.json"
          python3 scripts/normalize-generated.py compare tests/roadmap/try-pointers/TryPointers/Gen.lean "$fresh/Gen.lean" "$fresh/generated-report.json"

      # L04 aliasing/cleanup: retained AIR is hand-written; export comparison is pending.
      - name: Pointer try alias and cleanup rules
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          lake build ZigLean.Sep.TryAlias
          bash tests/roadmap/try-pointers/aliases/check.sh --check-artifacts
          bash tests/roadmap/try-pointers/aliases/check.sh --native
          fresh=$(mktemp -d "$RUNNER_TEMP/air2lean-pointer-try-aliases.XXXXXX")
          trap 'rm -rf "$fresh"' EXIT
          bash tests/roadmap/try-pointers/aliases/check.sh --export "$fresh/air"
          python3 tests/roadmap/try-pointers/aliases/check-artifacts.py --fresh-air "$fresh/air"

      # T02: wasm32 and x86_64 translations of one source, layouts, both-profile proofs and
      # the 32-bit rejections; native layout/boundary tests, wasm32-wasi under Node's WASI.
      - name: Pointer-width profiles (wasm32, x86_64)
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          lake build ZigLean Air2Lean air2lean ZigLean.Mem.WidthLemmas
          bash tests/roadmap/pointer-width/check.sh
          bash tests/roadmap/pointer-width/check.sh --native

      # T03: s390x (big endian) and x86_64 translations of one source, both-order proofs, the
      # big-endian rejections, and the native program on s390x under qemu-user and on the host.
      - name: Byte order (s390x big endian, x86_64)
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG_NATIVE: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
          AIR2LEAN_S390X_RUN: qemu-s390x-static
          AIR2LEAN_X86_64_RUN: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          lake build ZigLean Air2Lean air2lean ZigLean.EndianLemmas
          bash tests/roadmap/big-endian/check.sh --native
          fresh=$(mktemp -d "$RUNNER_TEMP/air2lean-big-endian-source.XXXXXX")
          trap 'rm -rf "$fresh"' EXIT
          bash tests/roadmap/big-endian/check.sh --export "$fresh"
          # A fresh export translates to the retained Gen.lean files byte for byte.
          for pair in S390x:s390x-linux X64:x86_64-linux; do
            "$AIR2LEAN_TRANSLATOR" "$fresh/${pair#*:}" -o "$fresh/${pair%%:*}.lean" \
              --namespace "BigEndian.${pair%%:*}" --prefix big_endian.
            cmp "$fresh/${pair%%:*}.lean" "tests/roadmap/big-endian/BigEndian/${pair%%:*}/Gen.lean"
          done
          diff <(ls "$fresh/s390x-reject") <(ls tests/roadmap/big-endian/air/0.16.0/s390x-reject)

      # Never writes a tracked file. A translation that differs from the committed module
      # (another version's or OS's) is built and tested in a check tree; the steps below that
      # build this version's proofs run in .lake/check-reports/<version>/build-tree.
      - name: Golden AIR, translate, build, differential test
        if: ${{ !matrix.mutate }}
        env:
          AIR2LEAN_CI: "1"
          AIR2LEAN_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_DIFF: ${{ matrix.full && '1' || '0' }}
          AIR2LEAN_OUT_DIR: ${{ runner.temp }}/air-out
        run: scripts/check.sh

      # T06: the same differential examples in the other optimize modes on LLVM, checked against
      # the committed x86_64-linux run records (docs/build-modes.md). ReleaseFast and
      # ReleaseSmall exclude the inputs on which the model throws (illegal behaviour there).
      - name: Native build-mode differential runs (Debug, ReleaseFast, ReleaseSmall on LLVM)
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-modes"
          failed=0
          for mode in Debug ReleaseFast ReleaseSmall; do
            summary="$RUNNER_TEMP/build-modes/$mode.json"
            # ReleaseFast/ReleaseSmall have triaged mismatches (float @divExact), so diff.sh exits 1
            # there; `record --verify` then requires exactly the committed counts and triage.
            status=0
            AIR2LEAN_DIFF_OPTIMIZE=$mode AIR2LEAN_DIFF_BACKEND=llvm \
              AIR2LEAN_DIFF_REPORT="$summary" scripts/diff.sh || status=$?
            [ "$status" -eq 0 ] || [ "$mode" != Debug ]
            python3 scripts/build-modes.py record --verify --summary "$summary" \
              --zig "$(command -v zig)" --zig-version "${{ matrix.zig }}" --target x86_64-linux \
              --mode "$mode" --backend llvm --explicit-backend \
              $([ "$mode" = Debug ] || echo --triage tests/roadmap/build-modes/reproducers/triage-float-divexact.json) \
              || failed=1
          done
          [ "$failed" -eq 0 ]

      # The summaries behind the build-mode check, so that a changed example set can be
      # re-recorded (`build-modes.py record --summary ... --zig-sha256 ...`, docs/build-modes.md).
      - name: Upload the build-mode differential summaries
        if: ${{ !cancelled() && matrix.full && matrix.zig == '0.16.0' && !matrix.mutate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-mode-summaries-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/build-modes/
          if-no-files-found: warn
          retention-days: 30

      # A failed check hands out the AIR that this host dumped: the golden files of this OS
      # (tests/golden/<version>/<ex>/air-linux/) come from here (docs/generated-code.md).
      - name: Upload the dumped AIR
        if: failure() && !matrix.mutate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: air-${{ matrix.zig }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/air-out
          if-no-files-found: ignore
          retention-days: 7

      # Q04: this version/target's row of the accounting table (exact matches only in the
      # headline) and the README legacy-version claims checked against the summary actually run.
      - name: Per-version differential accounting and support claims
        if: ${{ matrix.full && !matrix.mutate }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          summary=tests/diff/out/report.json
          out="$RUNNER_TEMP/accounting"
          python3 scripts/accounting.py publish --summary "$summary" \
            --json "$out/accounting.json" --markdown "$out/accounting.md"
          python3 scripts/accounting.py check --json "$out/accounting.json" --summary "$summary"
          python3 scripts/accounting.py claims --summary "$summary"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$out/accounting.md" >> "$GITHUB_STEP_SUMMARY"; fi

      # Kept even when the differential gate fails: an incomplete summary records why.
      # `python3 scripts/accounting.py publish` consumes these across versions.
      - name: Upload the differential summary
        if: ${{ !cancelled() && matrix.full && !matrix.mutate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-summary-${{ matrix.zig }}-${{ runner.os }}-${{ runner.arch }}
          path: tests/diff/out/report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Typed outcomes and bounded schedule regressions
        if: ${{ !matrix.mutate && matrix.full && matrix.zig == '0.15.2' || !matrix.mutate && matrix.full && matrix.zig == '0.16.0' }}
        run: |
          summary="$PWD/tests/diff/out/report.json"  # check.sh writes it in the checkout.
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)  # The modules check.sh built.
          cd "$tree"
          python3 -I -B tests/roadmap/outcome-accounting/test_report.py
          python3 -I -B tests/roadmap/outcome-accounting/test_schedules.py
          # Relink against this version's archive produced by the differential gate.
          rm -f tests/diff/.lake/build/bin/schedules
          (cd tests/diff && lake build schedules)
          (cd tests/diff && lake env lean ../roadmap/outcome-accounting/Check.lean)
          (cd tests/diff && lake env lean ../roadmap/outcome-accounting/Search.lean)
          (cd tests/diff && lake env lean ../roadmap/outcome-accounting/Schedule.lean)
          python3 scripts/schedules.py enumerate --example atomics --function mpRelAcq \
            --fuel 1000 --node-cap 4 --prefix-cap 128 --output "$RUNNER_TEMP/schedules.json"
          python3 scripts/schedules.py replay --receipt "$RUNNER_TEMP/schedules.json" \
            --output "$RUNNER_TEMP/schedule-replay.json"
          # Separate observed/enumeration coverage; the summary keeps qualified=false.
          python3 scripts/diff-report.py compare --summary "$RUNNER_TEMP/schedule-report.json" \
            --root "$PWD" --examples atomics --version "${{ matrix.zig }}" --host "$(uname -s)-$(uname -m)" \
            --schedule-receipts "$RUNNER_TEMP/schedules.json $RUNNER_TEMP/schedule-replay.json"
          python3 scripts/schedules.py replay --summary "$summary" \
            --example threads --function claimOnce --output "$RUNNER_TEMP/witness-replay.json"
          # P08: the relaxed message-passing race replays; limits stay unsolved.
          python3 -I -B tests/roadmap/counterexamples/test_e2e.py tests/diff/.lake/build/bin/schedules
          zig build-exe -OReleaseSafe -lc --dep common \
            -Mroot=tests/roadmap/outcome-accounting/Native.zig \
            -Mcommon=tests/diff/common.zig -femit-bin="$RUNNER_TEMP/outcome-native"
          python3 tests/roadmap/outcome-accounting/test_native.py "$RUNNER_TEMP/outcome-native"
          python3 tests/roadmap/outcome-accounting/test_parent_oom.py "$(command -v zig)"

      # The proofs must hold for this version's translation too (0.14.1 has its own `layout`,
      # `variants` and `floatops` translations): built where check.sh built it.
      - name: Build proofs
        if: ${{ !matrix.mutate }}
        run: |
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)  # The modules check.sh built.
          cd "$tree"
          lake build Proofs
          lake env lean tests/roadmap/container-contracts/Clients.lean
          if [ "${{ matrix.full }}" = "true" ] && [ "${{ matrix.zig }}" = "0.16.0" ]; then
            lake env lean --run tests/roadmap/rwlock-contracts/Runtime.lean
            lake env lean --run tests/roadmap/sync-contracts/Runtime.lean
            lake env lean --run tests/roadmap/shared-reclamation/Runtime.lean
            lake env lean --run tests/roadmap/pointer-atomics/Generate.lean "$RUNNER_TEMP/pointer-atomics"
            lake env lean "$RUNNER_TEMP/pointer-atomics/PtrAtomics.lean"
            # C09: semantic mutants of the pointer-publication client must be rejected.
            lake env lean --run tests/roadmap/pointer-atomics/Mutants.lean
            # C07: detached threads and handle ownership (kernel witnesses; detach admission
            # and emission, whose generated module must elaborate).
            lake env lean tests/roadmap/detached-threads/Runtime.lean
            detach_dir=$(mktemp -d "$RUNNER_TEMP/detached-threads.XXXXXX")
            lake env lean --run tests/roadmap/detached-threads/Pipeline.lean "$detach_dir/Detached.lean"
            lake env lean -R "$detach_dir" "$detach_dir/Detached.lean"
          fi
          # C05: sampled spurious-wake and cancelation schedules (no translation involved).
          lake env lean --run tests/roadmap/cancellation/Runtime.lean

      # Qualify the complete Zig 0.16.0 Linux translation selected above. The explicit
      # assembly/libm policy is reviewed for this profile and the pinned Lean release.
      - name: Audit theorem dependencies and assumptions
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          rm -f "$RUNNER_TEMP/air2lean-assumptions.json" "$RUNNER_TEMP/kernel-replay-cache.json"
          # S1: also replays every shipped module through the toolchain's leanchecker; the cache
          # lets the theorem-universe step below skip byte-identical modules of this build.
          time scripts/assumptions.sh --output "$RUNNER_TEMP/air2lean-assumptions.json" \
            --replay-cache "$RUNNER_TEMP/kernel-replay-cache.json"
          python3 scripts/float-semantics.py check-report "$RUNNER_TEMP/air2lean-assumptions.json"

      # F2: every module docs/premise-index.md indexes (tutorials, case studies, tests/roadmap
      # theorem directories) is compiled and audited like the shipped scope: sorryAx, axiom
      # policy and kernel replay. Exit codes alone accept `sorry`. The three files that need a
      # gate-time translation are audited by their gates (theorem_universe.py GATES).
      - name: Theorem universe audit
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          # Fixture oleans that later steps (claims, assurance) compile into the cached Lake
          # library; `lake env` searches it first, so they would shadow `tests.roadmap.*` modules.
          rm -rf .lake/build/lib/lean/tests
          time python3 -B scripts/theorem_universe.py audit --output-dir "$RUNNER_TEMP/theorem-universe" \
            --shipped "$RUNNER_TEMP/air2lean-assumptions.json" --replay-cache "$RUNNER_TEMP/kernel-replay-cache.json"

      # Architecture audit 4/6 counterexamples (docs/architecture-audit/claims.md): every finding
      # stays fixed: kernel bypass (S1), spoofed heads (S2), vacuous or circular hypotheses (S3),
      # ground instances (S4), roots outside the subject (S5), non-returning programs (S6), total
      # asm opaques (S7), receipt schema skew (F1), unaudited theorem files (F2), untyped host
      # differences and unpinned exclusions (F3), stale evidence (H1).
      - name: Architecture-audit claim fixtures
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          lake build ZigLean AssuranceTools Proofs.Asm.Gen ZigLean.Witness
          tests/roadmap/architecture-audit/claims/check.sh --require-fixed=S1,S2,S3,S4,S5,S6,S7,F1,F2,F3,H1

      # Same premise tables over the kernel dependency graph of the audited translation.
      # --strict: the committed source index must cover every kernel-derived premise (D03).
      - name: Map audited theorems to premise IDs
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        run: |
          python3 -B scripts/premises.py compiled --assurance "$RUNNER_TEMP/air2lean-assumptions.json" \
            --output "$RUNNER_TEMP/air2lean-premises.json" --strict

      # A03: real generated asm wrappers under a test-only interpretation, five wrapper
      # mutants, and the harness kept out of the audited theorem dependencies.
      - name: Generated asm wrappers, interpretation and mutations
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 tests/roadmap/asm-wrappers/harness.py --work "$RUNNER_TEMP/asm-wrappers"
          python3 tests/roadmap/asm-wrappers/audit.py --assurance "$RUNNER_TEMP/air2lean-assumptions.json"

      # A01: the asm effect contract. Retained translation of hand-written AIR (+r, +m, =m,
      # aliases, registry `memory` clobber), frame/alias proofs on the generated wrappers, CLI
      # rejections, and the wrappers under the A03 interpretation with six effect mutants.
      - name: Asm effect contract
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        run: |
          set -euo pipefail
          lake build ZigLean Proofs.Asm.Effects
          bash tests/roadmap/asm-effects/check.sh

      - name: Assurance environment regressions
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/proof-receipts/test_receipt.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/proof-receipts/test_check.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/proof-receipts/test_ci_stash.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/roadmap/proof-receipts/test_rss_budget.py
          tests/roadmap/assurance/check.sh

      # Claim strength is derived from extracted theorem types; overstated goals are rejected.
      - name: Claim strength regressions
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: tests/roadmap/claims/check.sh

      # Error returns satisfy a partial triple; every model failure constructor falsifies it.
      - name: Outcome taxonomy Lean fixture
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
        run: lake env lean tests/roadmap/outcome-taxonomy/Taxonomy.lean

      # Every tutorial: Main.lean and the solved exercise elaborate, the negative control fails
      # with its expected error. `lake build Proofs` above built the imported modules. This and
      # the Lean steps below that import proof modules run where check.sh built them.
      - name: Tutorials
        if: ${{ !matrix.mutate }}
        run: |
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)
          cd "$tree"
          python3 -B scripts/tutorials.py check --results "$RUNNER_TEMP/tutorials"

      - name: Memory-safety tutorial
        if: ${{ !matrix.mutate }}
        run: |
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)
          cd "$tree"
          lake env lean tutorials/memory-safety/Main.lean
          lake env lean tutorials/memory-safety/Controls.lean

      - name: Integer bit operations regression and differential gate
        if: ${{ matrix.full && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-0.16.0/bin/zig
          AIR2LEAN_ZIG: zig
          AIR2LEAN_BITOPS_OUT_DIR: ${{ runner.temp }}/air2lean-bitops
        run: tests/roadmap/bitops/check.sh

      # L02 native qualification of the wide cases (tests/roadmap/bitops-native): AIR of
      # wide.zig is exported with this row's patched compiler, translated and evaluated in Lean,
      # and every row is compared with stock Zig executables in four optimization modes:
      # x86_64-linux natively and aarch64-linux under qemu-user. The committed evidence
      # (aarch64-macos and native aarch64-linux come from their own jobs) must be reproduced.
      # 0.17.0 has no wide bit-operation evidence yet (qualify.py VERSIONS).
      - name: Wide integer bit operations native differential (x86_64-linux, aarch64-linux)
        if: ${{ !matrix.mutate && matrix.zig == '0.14.1' || !matrix.mutate && matrix.zig == '0.15.2' || !matrix.mutate && matrix.zig == '0.16.0' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          python3 -B tests/roadmap/bitops-native/gen.py --check
          python3 -B tests/roadmap/bitops-native/qualify.py check
          lake build ZigLean Air2Lean air2lean
          python3 -B tests/roadmap/bitops-native/qualify.py run --version "${{ matrix.zig }}" \
            --zig-air "$PWD/zig-air-${{ matrix.zig }}/bin/zig" --zig zig \
            --targets x86_64-linux,aarch64-linux \
            --exec x86_64-linux=host,aarch64-linux=qemu:qemu-aarch64-static \
            --evidence "$RUNNER_TEMP/bitops-native.json"
          python3 -B tests/roadmap/bitops-native/qualify.py verify --fresh "$RUNNER_TEMP/bitops-native.json" \
            --committed "tests/roadmap/bitops-native/evidence/${{ matrix.zig }}.json"

      # Check source-linked VCs against the pointer translation that check.sh built.
      - name: Build optional verification conditions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)
          cd "$tree"
          mkdir -p "$RUNNER_TEMP/vcs"
          lake build ZigLean.VC Proofs.Pointers.Gen Proofs.Basic.Gen Proofs.Errors.Gen 2>&1 | tee "$RUNNER_TEMP/vcs/build.log"

      - name: Result verification condition regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)
          cd "$tree"
          lake env lean tests/roadmap/vcs/Result.lean 2>&1 | tee "$RUNNER_TEMP/vcs/Result.log"

      - name: Memory verification condition regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)
          cd "$tree"
          lake env lean tests/roadmap/vcs/Memory.lean 2>&1 | tee "$RUNNER_TEMP/vcs/Memory.log"

      - name: Verification condition client regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)
          cd "$tree"
          lake env lean tests/roadmap/vcs/Clients.lean 2>&1 | tee "$RUNNER_TEMP/vcs/Clients.log"

      # Reflect committed loop-free translations into the VC AST; loops must request invariants.
      - name: Automatic verification condition extraction regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)
          cd "$tree"
          lake env lean tests/roadmap/vcs/Extract.lean 2>&1 | tee "$RUNNER_TEMP/vcs/Extract.log"

      - name: Verification condition report regressions
        if: ${{ !matrix.mutate }}
        run: |
          set -euo pipefail
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)
          cd "$tree"
          python3 -B scripts/vc-report.py --json \
            --import Proofs.Basic.Gen --import Proofs.Pointers.Gen --import Proofs.Errors.Gen \
            --namespace Basic --namespace Pointers --namespace Errors \
            tests/roadmap/vcs/Extract.lean > "$RUNNER_TEMP/vcs/report.json"
          diff -u tests/roadmap/vcs/report.json "$RUNNER_TEMP/vcs/report.json"

      # Labelled switch loops share the same AIR contract in 0.14/0.15/0.16; 0.17.0 is not
      # yet a qualified dispatch profile (tests/roadmap/dispatch/check.sh rejects it).
      - name: Loop-switch dispatch regressions
        if: ${{ !matrix.mutate && matrix.zig == '0.14.1' || !matrix.mutate && matrix.zig == '0.15.2' || !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
          AIR2LEAN_DISPATCH_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_DISPATCH_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_DISPATCH_ZIG_STOCK: zig
        run: |
          if [ "$AIR2LEAN_DISPATCH_ZIG_VERSION" = "0.16.0" ]; then
            tests/roadmap/dispatch/check.sh
          else
            tests/roadmap/dispatch/check.sh --native-only
          fi

      # Dispatch-loop template tactic; the generated tokenizer proof names 0.16.0 loop IDs.
      - name: Dispatch-loop template regressions
        if: ${{ !matrix.mutate }}
        env:
          LEAN_NUM_THREADS: "1"
          AIR2LEAN_DISPATCH_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_DISPATCH_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_DISPATCH_ZIG_STOCK: zig
        run: |
          if [ "$AIR2LEAN_DISPATCH_ZIG_VERSION" = "0.16.0" ]; then
            tests/roadmap/dispatch-templates/check.sh
          else
            tests/roadmap/dispatch-templates/check.sh --template-only
          fi

      - name: Local-place parent pointer regressions
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
          AIR2LEAN_LOCAL_PARENT_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_LOCAL_PARENT_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_LOCAL_PARENT_ZIG_STOCK: zig
        run: bash tests/roadmap/local-parent/check.sh

      - name: Callable-address table and indirect call regressions
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          LEAN_NUM_THREADS: "1"
          AIR2LEAN_INDIRECT_CALLS_ZIG_VERSION: ${{ matrix.zig }}
          AIR2LEAN_INDIRECT_CALLS_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_INDIRECT_CALLS_ZIG_STOCK: zig
        run: bash tests/roadmap/indirect-calls/check.sh

      # The complete review stack is required. Version-neutral parser/runtime regressions
      # and aggregate proofs use the modules selected above; exporter fidelity uses this Zig.
      - name: Review regressions
        if: ${{ !matrix.mutate }}
        env:
          AIR2LEAN_REVIEW_ZIG14: ${{ matrix.zig == '0.14.1' && format('{0}/zig-air-{1}/bin/zig', github.workspace, matrix.zig) || '' }}
          AIR2LEAN_REVIEW_ZIG15: ${{ matrix.zig == '0.15.2' && format('{0}/zig-air-{1}/bin/zig', github.workspace, matrix.zig) || '' }}
          AIR2LEAN_REVIEW_ZIG16: ${{ matrix.zig == '0.16.0' && format('{0}/zig-air-{1}/bin/zig', github.workspace, matrix.zig) || '' }}
          AIR2LEAN_REVIEW_ZIG17: ${{ matrix.zig == '0.17.0' && format('{0}/zig-air-{1}/bin/zig', github.workspace, matrix.zig) || '' }}
          AIR2LEAN_REVIEW_TRANSLATOR: ${{ github.workspace }}/.lake/build/bin/air2lean
        run: |
          tree=$(cat .lake/check-reports/${{ matrix.zig }}/build-tree)
          cd "$tree"
          scripts/review.sh

      - name: Weak CAS safety qualification
        if: ${{ !matrix.mutate && matrix.zig == '0.16.0' }}
        env:
          AIR2LEAN_ZIG_AIR: ${{ github.workspace }}/zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_ZIG: ${{ github.workspace }}/host-zig/zig
          AIR2LEAN_WEAK_CAS_ARTIFACT_DIR: ${{ runner.temp }}/weak-cas-qualification
        run: scripts/weak-cas.sh full

      # Source scan over the theorem universe: placeholders and kernel escape hatches.
      - name: Check for sorry/admit/native_decide and kernel escape hatches
        if: matrix.full
        run: scripts/no-sorry.sh

      # 0.15.2 on macOS: `Thread.Mutex` is `os_unfair_lock` (tests/golden/0.15.2/threadsync/
      # Gen-darwin.lean). The `threadsync` proofs hold for that translation too: built in a
      # check tree, so the checkout's Proofs/Threadsync/Gen.lean is never replaced. These
      # modules import no other example's translation.
      - name: Build threadsync proofs (macOS translation)
        if: ${{ !matrix.mutate && matrix.zig == '0.15.2' }}
        run: |
          python3 scripts/check-tree.py create .lake/check-tree/0.15.2-darwin \
            --replace Proofs/Threadsync/Gen.lean=tests/golden/0.15.2/threadsync/Gen-darwin.lean
          cd .lake/check-tree/0.15.2-darwin
          lake build Proofs.Threadsync.Lock Proofs.Threadsync.Mutex Proofs.Threadsync.WaitGroup Proofs.Threadsync.Handoff
          # The cross-target tutorial holds for this translation too, and the Linux constant fails.
          lake env lean tutorials/cross-target/Main.lean
          lake env lean tutorials/cross-target/Solution.lean
          if lake env lean tutorials/cross-target/NegativeMacos.lean > "$RUNNER_TEMP/negative-macos.log" 2>&1; then
            echo 'Lean accepted tutorials/cross-target/NegativeMacos.lean' >&2; exit 1
          fi
          grep -q 'NegativeMacos.lean:[0-9]*:[0-9]*: error: Application type mismatch' "$RUNNER_TEMP/negative-macos.log" \
            || { cat "$RUNNER_TEMP/negative-macos.log" >&2; exit 1; }

      - name: Mutation check
        if: matrix.mutate
        env:
          AIR2LEAN_ZIG_AIR: zig-air-${{ matrix.zig }}/bin/zig
          AIR2LEAN_MUTATION_SHARD: ${{ matrix.shard }}
          AIR2LEAN_MUTATION_SHARDS: "5"
          AIR2LEAN_MUTATION_KILL_LOG: ${{ runner.temp }}/mutation-kills.log
        run: scripts/mutate.sh

      # Each mutation of the shard was killed by the regression assurance/mutation-kills.json names.
      - name: Mutation kill evidence
        if: matrix.mutate
        run: python3 -B scripts/mutation-map.py kills verify --log "$RUNNER_TEMP/mutation-kills.log"

      # Keep the selected generated/profile context and final compiled library together.
      # This owns its sole guard; evidence stays outside cached .lake, with no upload.
      - name: Revision-bound theorem audit receipt
        if: ${{ matrix.full && matrix.zig == '0.16.0' && !matrix.mutate && runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          repo_root=$(python3 -c 'from pathlib import Path; print(Path.cwd().resolve())')
          cd "$repo_root"
          # check.sh left this host's profile-headed translations in Proofs/<Ex>/Gen.lean. With
          # AIR2LEAN_CI=1 it already failed on any body that differs from the committed module, so
          # only the header is discarded here; the receipt binds the committed modules.
          git checkout -- Proofs
          temp_root=$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True))' "$RUNNER_TEMP")
          lean_executable=$(elan which lean)
          lean_toolchain=$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True).parent.parent)' "$lean_executable")
          guard="$repo_root/scripts/build-guard.py"
          guard_sha=$(python3 -c 'import hashlib,sys; from pathlib import Path; print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())' "$guard")
          receipt_parent=$(mktemp -d "$temp_root/proof-receipt.XXXXXX")
          export AIR2LEAN_BUILD_LOCK="$temp_root/air2lean-build.lock"
          export PYTHONDONTWRITEBYTECODE=1
          # BEGIN proof receipt compiler stash
          compiler_stash=$(mktemp -d "$temp_root/proof-receipt-compilers.XXXXXX")
          restore_receipt_compilers() {
            original_status=$?
            trap - EXIT
            restore_failed=0
            for compiler in host-zig zig-air-0.16.0; do
              if [ -e "$compiler_stash/$compiler" ] || [ -L "$compiler_stash/$compiler" ]; then
                if [ -e "$repo_root/$compiler" ] || [ -L "$repo_root/$compiler" ]; then
                  echo "proof receipt compiler restore collision: $repo_root/$compiler; retained $compiler_stash/$compiler" >&2
                  restore_failed=1
                elif ! mv -T --no-clobber -- "$compiler_stash/$compiler" "$repo_root/$compiler"; then
                  echo "proof receipt compiler restore failed: $compiler_stash/$compiler" >&2
                  restore_failed=1
                elif [ -e "$compiler_stash/$compiler" ] || [ -L "$compiler_stash/$compiler" ]; then
                  echo "proof receipt compiler restore skipped; retained $compiler_stash/$compiler" >&2
                  restore_failed=1
                fi
              fi
            done
            if [ "$original_status" -eq 0 ] && [ "$restore_failed" -ne 0 ]; then original_status=2; fi
            exit "$original_status"
          }
          # Install before validation or either move; a partial setup also restores owned roots.
          trap restore_receipt_compilers EXIT
          python3 - "$repo_root" "$compiler_stash" <<'PYSTASH'
          from pathlib import Path
          import subprocess, sys
          root, stash = map(Path, sys.argv[1:])
          if root.resolve(strict=True) != root or stash.resolve(strict=True) != stash or stash.is_relative_to(root):
              raise SystemExit('proof receipt compiler stash requires physical paths outside the checkout')
          names = ('host-zig', 'zig-air-0.16.0')
          tracked = subprocess.run(['git', '-C', str(root), 'ls-files', '-z', '--', *names],
                                   check=True, stdout=subprocess.PIPE, timeout=5).stdout
          if tracked:
              raise SystemExit('proof receipt compiler roots contain tracked files')
          for name in names:
              path = root / name
              if path.is_symlink() or not path.is_dir() or path.resolve(strict=True) != path:
                  raise SystemExit('proof receipt compiler root must be a physical directory: ' + str(path))
          PYSTASH
          for compiler in host-zig zig-air-0.16.0; do
            mv -T --no-clobber -- "$repo_root/$compiler" "$compiler_stash/$compiler"
            if [ -e "$repo_root/$compiler" ] || [ -L "$repo_root/$compiler" ]; then
              echo "proof receipt compiler stash move incomplete: $repo_root/$compiler" >&2
              exit 2
            fi
          done
          # END proof receipt compiler stash
          # No step writes a tracked file, so the receipt binds a clean tree (no --allow-dirty;
          # release consumers refuse a receipt that recorded that permission).
          bash tests/roadmap/proof-receipts/check.sh \
            --guard "$guard" --guard-sha256 "$guard_sha" \
            "$receipt_parent/attempt" "$lean_toolchain" ci-linux-0.16-all-shipped
          # I06 end to end: coverage over this genuine receipt, the real translator and a real I07 manifest.
          python3 tests/roadmap/coverage-report/real_run.py "$receipt_parent/attempt" .lake/build/bin/air2lean

      # Verification must not change its own inputs: no step may modify, delete or add a
      # tracked or unignored file (build outputs and tool downloads are gitignored).
      - name: Checkout unchanged by verification
        run: |
          changes=$(git status --porcelain=v1 --untracked-files=all)
          if [ -n "$changes" ]; then
            printf 'error: verification changed the checkout:\n%s\n' "$changes" >&2
            exit 1
          fi

  # Q05: native aarch64-macos evidence for the Darwin paths compatibility.json declares
  # (assurance/target-matrix.json, docs/target-matrix.md). One job without a matrix, since
  # macOS runner concurrency is limited; each evidence step binds AIR2LEAN_ZIG_VERSION.
  # WASM is not a declared target (T02/T05).
  macos:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stock aarch64-macos releases bootstrap zig-patch/build.sh and build the native
      # probes/harnesses. sha256 from https://ziglang.org/download/index.json
      # ("<version>" -> "aarch64-macos".shasum), confirmed by downloading and hashing each.
      - name: Install stock zig (aarch64-macos)
        run: |
          set -euo pipefail
          install_zig() {
            curl -fL --output "$RUNNER_TEMP/zig-$1.tar.xz" \
              "https://ziglang.org/download/$1/zig-aarch64-macos-$1.tar.xz"
            echo "$2  $RUNNER_TEMP/zig-$1.tar.xz" | shasum -a 256 -c -
            mkdir -p "$RUNNER_TEMP/host-zig-$1"
            tar -xJf "$RUNNER_TEMP/zig-$1.tar.xz" -C "$RUNNER_TEMP/host-zig-$1" --strip-components=1
            [ "$("$RUNNER_TEMP/host-zig-$1/zig" version)" = "$1" ]
          }
          install_zig 0.17.0 b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
          install_zig 0.16.0 b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
          install_zig 0.15.2 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b

      # Builds and executes probe.zig for aarch64-macos-none (docs/profiles.md).
      - name: macOS ABI target probe (0.16.0)
        env:
          AIR2LEAN_ZIG_VERSION: "0.16.0"
        run: |
          set -euo pipefail
          python3 tests/roadmap/abi-probes/test_probe.py
          for mode in ReleaseSafe ReleaseFast; do
            python3 scripts/abi-probe.py observe --zig "$RUNNER_TEMP/host-zig-0.16.0/zig" \
              --profile "tests/roadmap/abi-probes/aarch64-macos-none-$mode.json" \
              --output "$RUNNER_TEMP/abi-aarch64-macos-none-$mode.json"
          done

      # 0.15.2's contracts (tests/roadmap/abi-probes/0.15.2/) differ from 0.16.0's only in
      # the LLVM feature names (zcm vs zcm_fpr64/zcm_gpr64).
      - name: macOS ABI target probe (0.15.2)
        env:
          AIR2LEAN_ZIG_VERSION: "0.15.2"
        run: |
          set -euo pipefail
          for mode in ReleaseSafe ReleaseFast; do
            python3 scripts/abi-probe.py observe --zig "$RUNNER_TEMP/host-zig-0.15.2/zig" \
              --profile "tests/roadmap/abi-probes/0.15.2/aarch64-macos-none-$mode.json" \
              --output "$RUNNER_TEMP/abi-0.15.2-aarch64-macos-none-$mode.json"
          done

      # T04: the native aarch64-macos-none probe against its versioned expected results.
      - name: aarch64-macos ABI qualification (T04, 0.16.0)
        env:
          AIR2LEAN_ZIG_VERSION: "0.16.0"
        run: |
          set -euo pipefail
          python3 scripts/aarch64-abi.py check --zig "$RUNNER_TEMP/host-zig-0.16.0/zig" \
            --target aarch64-macos-none --output "$RUNNER_TEMP/aarch64-macos-none-ReleaseSafe.txt"

      # Zig 0.17.0 (in qualification) contract: tests/roadmap/abi-probes/0.17.0/ (LLVM 22 features).
      - name: macOS ABI target probe (0.17.0)
        env:
          AIR2LEAN_ZIG_VERSION: "0.17.0"
        run: |
          set -euo pipefail
          for mode in ReleaseSafe ReleaseFast; do
            python3 scripts/abi-probe.py observe --zig "$RUNNER_TEMP/host-zig-0.17.0/zig" \
              --profile "tests/roadmap/abi-probes/aarch64-macos-none-$mode.json" \
              --output "$RUNNER_TEMP/abi-0.17.0-aarch64-macos-none-$mode.json"
          done

      - name: Cache patched zig 0.17.0 (macOS)
        id: cache-zig-air-17
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-air-0.17.0/
          key: zig-air-macos-arm64-0.17.0-${{ hashFiles('zig-patch/air-json/*.zig', 'zig-patch/0.17.0/hook.patch', 'zig-patch/versions.toml', 'zig-patch/build.sh', 'zig-patch/lock.sh') }}

      - name: Cache patched zig 0.16.0 (macOS)
        id: cache-zig-air-16
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-air-0.16.0/
          key: zig-air-macos-arm64-0.16.0-${{ hashFiles('zig-patch/air-json/*.zig', 'zig-patch/0.16.0/hook.patch', 'zig-patch/versions.toml', 'zig-patch/build.sh', 'zig-patch/lock.sh') }}

      - name: Cache patched zig 0.15.2 (macOS)
        id: cache-zig-air-15
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-air-0.15.2/
          key: zig-air-macos-arm64-0.15.2-${{ hashFiles('zig-patch/air-json/*.zig', 'zig-patch/0.15.2/hook.patch', 'zig-patch/versions.toml', 'zig-patch/build.sh', 'zig-patch/lock.sh') }}

      # One retry per version, as in the Linux job. The 7 GiB runner is below the 7.8/8 GB
      # bound that Zig's build.zig declares for compiling the compiler; --maxrss lets it start.
      - name: Build patched zig (macOS)
        if: steps.cache-zig-air-17.outputs.cache-hit != 'true' || steps.cache-zig-air-16.outputs.cache-hit != 'true' || steps.cache-zig-air-15.outputs.cache-hit != 'true'
        env:
          AIR2LEAN_ZIG_MAXRSS: "8000000000"
        run: |
          set -euo pipefail
          for v in 0.17.0 0.16.0 0.15.2; do
            if [ ! -x "zig-air-$v/bin/zig" ]; then
              PATH="$RUNNER_TEMP/host-zig-$v:$PATH" zig-patch/build.sh "$v" \
                || PATH="$RUNNER_TEMP/host-zig-$v:$PATH" zig-patch/build.sh "$v"
            fi
          done

      # zig-patch/versions.toml [ci.elan] pins elan v4.2.4's Linux asset; this is the same
      # release's aarch64-apple-darwin asset (sha256 = the release asset digest, confirmed).
      - name: Install elan (macOS)
        run: |
          set -euo pipefail
          curl -fL --output "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-aarch64-apple-darwin.tar.gz
          echo "7ad829861392c718dfebde3a83b5c8508df47be02af68894b094b0b3952616e5  $RUNNER_TEMP/elan.tar.gz" \
            | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build (macOS root package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/*
            !.lake/check-tree
          key: lake-root-macos-arm64-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Cache Lake build (macOS tests/diff package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/diff/.lake
          key: lake-diff-macos-arm64-${{ hashFiles('tests/diff/lean-toolchain', 'tests/diff/lake-manifest.json') }}

      - name: Prune absent-source Lake modules
        run: python3 scripts/local-ci-steps.py --prune-cache

      - name: Build runtime library + translator (macOS)
        run: lake build

      # Fresh Darwin AIR export, compared with the goldens and their air-darwin/Gen-darwin
      # overrides, translated, built and differentially tested against native Zig (host-listed
      # float differences count as `host`, scripts/diff.sh). Never writes a tracked file: a
      # translation that differs from the committed module is built in a check tree.
      - name: macOS golden AIR, translate, differential test (0.16.0)
        env:
          AIR2LEAN_CI: "1"
          AIR2LEAN_ZIG_VERSION: "0.16.0"
          AIR2LEAN_DIFF: "1"
          AIR2LEAN_ZIG: ${{ runner.temp }}/host-zig-0.16.0/zig
          AIR2LEAN_OUT_DIR: ${{ runner.temp }}/air-out/0.16.0
          AIR2LEAN_DIFF_REPORT: ${{ runner.temp }}/diff-summary/0.16.0/report.json
        run: scripts/check.sh

      # Q04/Q05: this version's macOS row of the accounting table (docs/host-accounting.md).
      # Kept even when the differential gate fails: an incomplete summary records why.
      - name: Upload the macOS differential summary (0.16.0)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-summary-0.16.0-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/diff-summary/0.16.0/report.json
          if-no-files-found: warn
          retention-days: 30

      - name: macOS proofs (0.16.0)
        env:
          AIR2LEAN_ZIG_VERSION: "0.16.0"
        run: |
          tree=$(cat .lake/check-reports/0.16.0/build-tree)
          cd "$tree"
          lake build Proofs

      - name: macOS golden AIR, translate, differential test (0.17.0)
        env:
          AIR2LEAN_CI: "1"
          AIR2LEAN_ZIG_VERSION: "0.17.0"
          AIR2LEAN_DIFF: "1"
          AIR2LEAN_ZIG: ${{ runner.temp }}/host-zig-0.17.0/zig
          AIR2LEAN_OUT_DIR: ${{ runner.temp }}/air-out/0.17.0
          AIR2LEAN_DIFF_REPORT: ${{ runner.temp }}/diff-summary/0.17.0/report.json
        run: scripts/check.sh

      - name: macOS proofs (0.17.0)
        env:
          AIR2LEAN_ZIG_VERSION: "0.17.0"
        run: |
          tree=$(cat .lake/check-reports/0.17.0/build-tree)
          cd "$tree"
          lake build Proofs

      # 0.15.2's Thread.Mutex is os_unfair_lock here: check.sh selects
      # tests/golden/0.15.2/threadsync/Gen-darwin.lean and the proofs build against it natively.
      - name: macOS golden AIR, translate, differential test (0.15.2)
        env:
          AIR2LEAN_CI: "1"
          AIR2LEAN_ZIG_VERSION: "0.15.2"
          AIR2LEAN_DIFF: "1"
          AIR2LEAN_ZIG: ${{ runner.temp }}/host-zig-0.15.2/zig
          AIR2LEAN_OUT_DIR: ${{ runner.temp }}/air-out/0.15.2
          AIR2LEAN_DIFF_REPORT: ${{ runner.temp }}/diff-summary/0.15.2/report.json
        run: scripts/check.sh

      # Q04/Q05: this version's macOS row of the accounting table (docs/host-accounting.md).
      # Kept even when the differential gate fails: an incomplete summary records why.
      - name: Upload the macOS differential summary (0.15.2)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-summary-0.15.2-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/diff-summary/0.15.2/report.json
          if-no-files-found: warn
          retention-days: 30

      - name: macOS proofs (0.15.2)
        env:
          AIR2LEAN_ZIG_VERSION: "0.15.2"
        run: |
          tree=$(cat .lake/check-reports/0.15.2/build-tree)
          cd "$tree"
          lake build Proofs

      # As in the test job: no step may modify, delete or add a tracked or unignored file.
      - name: Checkout unchanged by verification (macOS)
        run: |
          changes=$(git status --porcelain=v1 --untracked-files=all)
          if [ -n "$changes" ]; then
            printf 'error: verification changed the checkout:\n%s\n' "$changes" >&2
            exit 1
          fi

      # L02: wide bit operations, native aarch64-macos (0.14.1 has no macOS patched compiler).
      - name: macOS wide integer bit operations native differential
        run: |
          set -euo pipefail
          for v in 0.16.0 0.15.2; do
            python3 -B tests/roadmap/bitops-native/qualify.py run --version "$v" \
              --zig-air "$PWD/zig-air-$v/bin/zig" --zig "$RUNNER_TEMP/host-zig-$v/zig" \
              --targets aarch64-macos --exec aarch64-macos=host \
              --evidence "$RUNNER_TEMP/bitops-native-$v.json"
            python3 -B tests/roadmap/bitops-native/qualify.py verify --fresh "$RUNNER_TEMP/bitops-native-$v.json" \
              --committed "tests/roadmap/bitops-native/evidence/$v.json"
          done

      # The Darwin dumps are the source of tests/golden/<version>/<ex>/air-darwin/ overrides.
      - name: Upload the dumped Darwin AIR
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: air-macos-arm64
          path: ${{ runner.temp }}/air-out
          if-no-files-found: ignore
          retention-days: 7

  # T04: native aarch64-linux ABI qualification (docs/aarch64-abi.md). Probe and compare only:
  # aarch64-linux translation stays undeclared, so this job builds no patched compiler, Lean
  # or proofs (the profile's proofs run in the test job, against the same expected file).
  aarch64-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # sha256 from https://ziglang.org/download/index.json ("0.16.0" -> "aarch64-linux".shasum).
      - name: Install stock zig (aarch64-linux)
        run: |
          set -euo pipefail
          curl -fL --output "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
          echo "ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/host-zig-0.16.0"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/host-zig-0.16.0" --strip-components=1
          [ "$("$RUNNER_TEMP/host-zig-0.16.0/zig" version)" = 0.16.0 ]

      - name: aarch64-linux ABI qualification (T04, 0.16.0)
        env:
          AIR2LEAN_ZIG_VERSION: "0.16.0"
        run: |
          set -euo pipefail
          python3 scripts/aarch64-abi.py check --zig "$RUNNER_TEMP/host-zig-0.16.0/zig" \
            --target aarch64-linux-gnu --output "$RUNNER_TEMP/aarch64-linux-gnu-ReleaseSafe.txt"

      - name: Upload aarch64-linux observation
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-aarch64-linux
          path: ${{ runner.temp }}/aarch64-linux-gnu-ReleaseSafe.txt
          if-no-files-found: ignore

  # L02: the wide bit-operation corpus on native aarch64-linux hardware. No Lean here: the
  # native stream must equal the Lean stream recorded in the committed evidence, which the
  # `test` and `macos` jobs reproduce from fresh translations. Matrix-free (a native job of
  # scripts/release-record.py): one step per Zig version.
  bitops-native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # sha256 from https://ziglang.org/download/index.json ("<version>" -> "aarch64-linux".shasum).
      - name: Install stock zig 0.16.0, 0.15.2 and 0.14.1 (aarch64-linux)
        run: |
          set -euo pipefail
          while read -r version sha256; do
            curl -fL --output "$RUNNER_TEMP/zig-$version.tar.xz" \
              "https://ziglang.org/download/$version/zig-aarch64-linux-$version.tar.xz"
            echo "$sha256  $RUNNER_TEMP/zig-$version.tar.xz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/host-zig-$version"
            tar -xJf "$RUNNER_TEMP/zig-$version.tar.xz" -C "$RUNNER_TEMP/host-zig-$version" --strip-components=1
            [ "$("$RUNNER_TEMP/host-zig-$version/zig" version)" = "$version" ]
          done <<'EOF'
          0.16.0 ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
          0.15.2 958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f
          0.14.1 f7a654acc967864f7a050ddacfaa778c7504a0eca8d2b678839c21eea47c992b
          EOF

      - name: Wide integer bit operations, native aarch64-linux
        run: |
          set -euo pipefail
          python3 -B tests/roadmap/bitops-native/gen.py --check
          # Every version runs; the step fails afterwards if any did.
          failed=""
          for version in 0.16.0 0.15.2 0.14.1; do
            python3 -B tests/roadmap/bitops-native/qualify.py native --version "$version" \
              --zig "$RUNNER_TEMP/host-zig-$version/zig" --target aarch64-linux \
              --evidence "tests/roadmap/bitops-native/evidence/$version.json" || failed="$failed $version"
          done
          [ -z "$failed" ] || { echo "native aarch64-linux bit-operation mismatch on:$failed" >&2; exit 1; }
