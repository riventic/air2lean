name: arm-tmp
# TEMPORARY (codex/arm-releasefast-hang): runs the build-modes-aarch64-linux job of ci.yml on the hosted
# arm runner (ci.yml itself only runs for PRs and main). Deleted before handback.
on:
  push:
    branches: [codex/arm-releasefast-hang]

permissions:
  contents: read

jobs:
  build-modes-aarch64-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stock zig 0.16.0 (aarch64-linux)
        run: |
          set -euo pipefail
          curl -fL --output "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
          echo "ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/host-zig-0.16.0"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/host-zig-0.16.0" --strip-components=1
          [ "$("$RUNNER_TEMP/host-zig-0.16.0/zig" version)" = 0.16.0 ]
          echo "$RUNNER_TEMP/host-zig-0.16.0" >> "$GITHUB_PATH"

      - name: Install elan (aarch64-linux)
        run: |
          set -euo pipefail
          url=$(zig-patch/toml-get.sh '[ci.elan-aarch64]' url)
          sha256=$(zig-patch/toml-get.sh '[ci.elan-aarch64]' sha256)
          curl -fL --output elan.tar.gz "$url"
          echo "$sha256  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz
          chmod +x elan-init
          ./elan-init --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build (root package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-root-linux-arm64-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Cache Lake build (tests/diff package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/diff/.lake
          key: lake-diff-linux-arm64-${{ hashFiles('tests/diff/lean-toolchain', 'tests/diff/lake-manifest.json') }}

      - name: Prune absent-source Lake modules
        run: python3 scripts/local-ci-steps.py --prune-cache

      - name: Build runtime library + translator
        run: lake build

      - name: Native build-mode differential runs (aarch64-linux, LLVM)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-modes"
          failed=0
          for mode in ReleaseSafe Debug ReleaseFast ReleaseSmall; do
            summary="$RUNNER_TEMP/build-modes/$mode.json"
            status=0
            AIR2LEAN_DIFF_OPTIMIZE=$mode AIR2LEAN_DIFF_BACKEND=llvm \
              AIR2LEAN_DIFF_REPORT="$summary" scripts/diff.sh || status=$?
            case "$mode" in ReleaseFast|ReleaseSmall) ;; *) [ "$status" -eq 0 ] || failed=1 ;; esac
            python3 scripts/build-modes.py record --verify --summary "$summary" \
              --zig "$(command -v zig)" --zig-version 0.16.0 --target aarch64-linux \
              --mode "$mode" --backend llvm --explicit-backend \
              $(case "$mode" in ReleaseFast|ReleaseSmall) echo --triage tests/roadmap/build-modes/reproducers/triage-float-divexact.json ;; esac) \
              || failed=1
          done
          [ "$failed" -eq 0 ]

      - name: Upload the build-mode differential summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-mode-summaries-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/build-modes/
          if-no-files-found: warn
          retention-days: 30
