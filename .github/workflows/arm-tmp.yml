name: arm-releasefast-tmp
# TEMPORARY (codex/arm-releasefast-hang): diagnose the ReleaseFast hang on ubuntu-24.04-arm. Deleted before handback.
on:
  push:
    branches: [codex/arm-releasefast-hang]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: orig
            mode: ReleaseFast
          - variant: fixed
            mode: ReleaseFast
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install stock zig 0.16.0 (aarch64-linux)
        run: |
          set -euo pipefail
          curl -fL --output "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
          echo "ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/host-zig-0.16.0"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/host-zig-0.16.0" --strip-components=1
          echo "$RUNNER_TEMP/host-zig-0.16.0" >> "$GITHUB_PATH"

      - name: System facts
        run: |
          set +e
          uname -a; nproc; free -m
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          echo "ulimit: $(ulimit -c) core, $(ulimit -u) nproc"
          cat /proc/sys/vm/overcommit_memory /proc/sys/kernel/pid_max /proc/sys/kernel/threads-max
          cat /sys/fs/cgroup/pids.max /sys/fs/cgroup/memory.max 2>&1
          systemctl is-active apport systemd-coredump.socket 2>&1
          ls -la /var/crash 2>&1 | head -5
          coredumpctl list 2>&1 | tail -3
          ls /usr/share/apport 2>&1 | head -3
          getconf PAGESIZE

      - name: Original harness sources
        if: matrix.variant == 'orig'
        run: |
          git checkout 9cdefbbd -- tests/diff/common.zig tests/diff/compat.zig
          git status --short

      - name: Install elan (aarch64-linux)
        run: |
          set -euo pipefail
          url=$(zig-patch/toml-get.sh '[ci.elan-aarch64]' url)
          sha256=$(zig-patch/toml-get.sh '[ci.elan-aarch64]' sha256)
          curl -fL --output elan.tar.gz "$url"
          echo "$sha256  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz
          chmod +x elan-init
          ./elan-init --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build (root package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-root-linux-arm64-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Cache Lake build (tests/diff package)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/diff/.lake
          key: lake-diff-linux-arm64-${{ hashFiles('tests/diff/lean-toolchain', 'tests/diff/lake-manifest.json') }}

      - name: Prune absent-source Lake modules
        run: python3 scripts/local-ci-steps.py --prune-cache

      - name: Build runtime library + translator
        run: lake build

      - name: diff.sh with watchdog
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set +e
          (while true; do
            echo "--- WATCHDOG $(date +%T) $(uptime | sed 's/.*load/load/') $(free -m | awk '/Mem/{print "used="$3" avail="$7}') procs=$(ps -e | wc -l)"
            ps -eo pid,ppid,stat,etimes,pcpu,rss,wchan:20,args --sort=-etimes | grep -E "air2lean-diff|difftest|zig|scripts/diff" | head -8 | cut -c1-200
            tail -n 2 "$RUNNER_TEMP/diff.log" | cut -c1-200
            sleep 30
          done) &
          AIR2LEAN_DIFF_OPTIMIZE=$MODE AIR2LEAN_DIFF_BACKEND=llvm \
            AIR2LEAN_DIFF_REPORT="$RUNNER_TEMP/$MODE.json" timeout -k 10 1200 scripts/diff.sh > "$RUNNER_TEMP/diff.log" 2>&1
          echo "diff.sh exit $?"
          tail -c 8000 "$RUNNER_TEMP/diff.log"
          kill %1
          tail -c 3000 "$RUNNER_TEMP/$MODE.json" 2>/dev/null | head -c 1500
