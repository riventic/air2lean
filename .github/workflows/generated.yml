name: Generated files

# docs/ci.md#whole-tree-generated-files. The whole-tree generated files (assurance/generated.json)
# are not committed on main; ci.yml's merge_group run regenerates them twice on the exact merge
# commit and uploads them. On each push to main this workflow appends one commit per new main
# commit to the `generated` branch, from the files of that commit's merge_group (or
# workflow_dispatch) CI run: scripts/generated.py publish checks the run, the commit, the tree and
# every digest, and regenerates nothing. Every 30 minutes, and after each publish, the freshness
# check fails when a main commit has had no entry for longer than freshness_minutes, and opens
# (or comments on) an issue.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# contents: write pushes the `generated` branch only (main's ruleset does not cover it);
# actions: read finds the CI run and downloads its artifacts; issues: write reports staleness.
permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: generated-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout main with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Also on schedule: a commit whose CI run finished later (a workflow_dispatch run after an
      # admin bypass) is published by the next scheduled run.
      - name: Publish the CI-produced files of every new main commit
        run: python3 scripts/generated.py publish --repo "$GITHUB_REPOSITORY" --push

      - name: Every main commit has its entry
        run: python3 scripts/generated.py freshness --repo "$GITHUB_REPOSITORY"

      - name: Report a stale generated branch
        if: failure()
        run: |
          set -euo pipefail
          title='generated branch is stale or failed to publish'
          body="Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed (docs/ci.md#whole-tree-generated-files). A main commit without a merge_group run (an admin bypass) needs a workflow_dispatch run of CI on it."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
