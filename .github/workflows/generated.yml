name: Generated files

# docs/ci.md#whole-tree-generated-files. The whole-tree generated files (assurance/generated.json)
# are not committed on main; ci.yml's `generated` and `provenance` jobs regenerate them twice on
# the exact commit they test and upload them. Every push to main runs ci.yml on the commit main
# now is (merges are admin merges), so each main commit has its own run. When a CI run on main
# completes, and every 30 minutes, this workflow appends one commit per new main commit to the
# `generated` branch, from that commit's run: scripts/generated.py publish checks the run, the
# commit, the tree and every digest, and regenerates nothing. After each publish the freshness
# check fails when a main commit has had no entry for longer than freshness_minutes, and opens
# (or comments on) an issue.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# contents: write fast-forwards the `generated` branch (its ruleset blocks only force pushes and
# deletion); actions: read finds each commit's CI run and downloads its artifacts; issues: write
# reports staleness.
permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: generated-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout main with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Publish the CI-produced files of every new main commit
        run: python3 scripts/generated.py publish --repo "$GITHUB_REPOSITORY" --push

      - name: Every main commit has its entry
        run: python3 scripts/generated.py freshness --repo "$GITHUB_REPOSITORY"

      - name: Report a stale generated branch
        if: failure()
        run: |
          set -euo pipefail
          title='generated branch is stale or failed to publish'
          body="Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed (docs/ci.md#whole-tree-generated-files). Main's newest commit has no entry: its CI push run is still queued, its generated or provenance job failed (fix forward, or gh run rerun --failed), or it has no run (gh workflow run ci.yml --ref main)."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
